// ── Outcome Modal (shown after approval closes trades) ────────────────────────
function OutcomeModal({trades, onClose}) {
  const [reasons, setReasons] = React.useState({});
  const [saving,  setSaving]  = React.useState(false);
  const setReason = (key, val) => setReasons(prev => ({...prev, [key]: val}));

  const save = async () => {
    setSaving(true);
    await Promise.all(trades.map(t => {
      const key = `${t.symbol}|${t.entry_date}`;
      const reason = reasons[key]?.trim();
      if (!reason) return Promise.resolve();
      return api('/trades/review', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({symbol: t.symbol, entry_date: t.entry_date, outcome_reason: reason}),
      }).catch(()=>{});
    }));
    setSaving(false);
    onClose();
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div style={{background:'#0f1318',border:'1px solid rgba(255,255,255,0.1)',borderRadius:10,
        padding:'24px',width:'min(480px,100%)',maxHeight:'80vh',overflowY:'auto',boxShadow:'0 24px 64px rgba(0,0,0,0.6)'}}>
        <div style={{fontFamily:'Space Grotesk',fontWeight:700,color:'#c8d0e0',fontSize:15,marginBottom:4}}>
          {trades.length === 1 ? 'Trade Closed' : `${trades.length} Trades Closed`}
        </div>
        <div style={{fontFamily:'Space Mono',fontSize:10,color:'#5a6478',marginBottom:20,letterSpacing:'.04em'}}>
          Add an outcome reason for each (optional — skip to save later)
        </div>

        {trades.map(t => {
          const key = `${t.symbol}|${t.entry_date}`;
          const isWin = t.pnl != null ? t.pnl >= 0 : null;
          return (
            <div key={key} style={{marginBottom:12,padding:'12px 14px',background:'rgba(255,255,255,0.03)',
              borderRadius:6,border:`1px solid ${isWin===true?'rgba(5,150,144,0.2)':isWin===false?'rgba(206,49,75,0.2)':'rgba(255,255,255,0.08)'}`}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                <span style={S.ticker}>{t.symbol}</span>
                <span style={{fontSize:9,fontFamily:'Space Mono',fontWeight:700,
                  color:t.direction==='LONG'?'#088885':'#F96E8F'}}>{t.direction}</span>
                <span style={{fontSize:10,color:'#5a6478',fontFamily:'Space Mono'}}>{t.exit_date}</span>
                <span style={{fontFamily:'Space Mono',fontSize:13,fontWeight:700,
                  color:isWin===true?GREEN:isWin===false?RED:'#5a6478',marginLeft:'auto'}}>
                  {t.pnl!=null?(isWin?'+':'')+fmt(t.pnl,2)+' '+t.currency:'P&L pending'}
                </span>
              </div>
              <textarea
                placeholder="What happened? Why did you exit?"
                value={reasons[key]||''}
                onChange={e=>setReason(key, e.target.value)}
                rows={2}
                style={{width:'100%',background:'#0a0d12',border:'1px solid rgba(255,255,255,0.1)',
                  borderRadius:4,color:'#c8d0e0',fontSize:11,fontFamily:'Space Mono',
                  padding:'6px 8px',resize:'vertical',outline:'none',boxSizing:'border-box'}}
              />
            </div>
          );
        })}

        <div style={{display:'flex',gap:8,marginTop:8}}>
          <button style={S.btn(true)} onClick={save} disabled={saving}>
            {saving ? 'Saving…' : 'Save & Close'}
          </button>
          <button style={S.btn()} onClick={onClose}>Skip</button>
        </div>
      </div>
    </div>
  );
}

// ── Diverging bar chart helpers ───────────────────────────────────────────────
function DivergingBars({rows, labelWidth=60, fmtVal}) {
  if (!rows||!rows.length) return null;
  const maxAbs = Math.max(...rows.map(r=>Math.abs(r.pnl)),1);
  const sqrtMax = Math.sqrt(maxAbs);
  const defaultFmt = (pnl,isPos) => (isPos?'+':'')+fmt(pnl,0);
  const valFmt = fmtVal || defaultFmt;
  return (
    <div>
      {rows.map((r,i)=>{
        const isPos=r.pnl>=0, bp=(sqrtMax>0?Math.sqrt(Math.abs(r.pnl))/sqrtMax:0)*0.85;
        return (
          <div key={i} style={{display:'flex',alignItems:'center',marginBottom:5,gap:6}}>
            <div style={{width:labelWidth,flexShrink:0,textAlign:'right',fontFamily:'Space Mono',fontSize:9,color:r.labelColor||'#09CDDF',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.label}</div>
            <div style={{flex:1,display:'flex',alignItems:'center',height:12,overflowX:'hidden'}}>
              <div style={{flex:1,display:'flex',justifyContent:'flex-end',height:'100%'}}>
                {!isPos&&<div style={{height:'100%',width:`${bp*100}%`,background:`${RED}99`,borderRadius:'3px 0 0 3px'}}/>}
              </div>
              <div style={{width:1,height:16,background:'rgba(255,255,255,0.1)',flexShrink:0}}/>
              <div style={{flex:1,height:'100%'}}>
                {isPos&&<div style={{height:'100%',width:`${bp*100}%`,background:`${GREEN}99`,borderRadius:'0 3px 3px 0'}}/>}
              </div>
            </div>
            <div style={{width:55,flexShrink:0,textAlign:'right',fontFamily:'Space Mono',fontSize:9,color:isPos?GREEN:RED}}>{valFmt(r.pnl,isPos)}</div>
            {r.sub!=null&&<div style={{width:30,flexShrink:0,textAlign:'right',fontFamily:'Space Mono',fontSize:9,color:'#5a6478'}}>{r.sub}</div>}
          </div>
        );
      })}
    </div>
  );
}

function DowBarChart({data}) {
  if (!data) return null;
  const ORDER=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const SHORT={Monday:'Mon',Tuesday:'Tue',Wednesday:'Wed',Thursday:'Thu',Friday:'Fri',Saturday:'Sat',Sunday:'Sun'};
  const rows=ORDER.map(d=>data[d]?{label:SHORT[d],pnl:data[d].total_pnl,sub:pct(data[d].win_rate)}:null).filter(Boolean);
  if (!rows.length) return null;
  return <div><div style={{...S.hdr,marginBottom:10}}>P&L by Day of Week</div><DivergingBars rows={rows} labelWidth={28}/></div>;
}

function MarketConditionChart({data}) {
  if (!data) return null;
  const ORDER=['Risk On','Neutral','Risk Off'];
  const COLORS={'Risk On':GREEN,'Neutral':'#c8d0e0','Risk Off':RED};
  const rows=ORDER.map(c=>data[c]?{label:c,pnl:data[c].total_pnl,sub:pct(data[c].win_rate),labelColor:COLORS[c]}:null).filter(Boolean);
  return (
    <div>
      <div style={{...S.hdr,marginBottom:10}}>P&L by Market Condition</div>
      {rows.length ? <DivergingBars rows={rows} labelWidth={60}/> : <div style={{color:'#5a6478',fontSize:11,fontFamily:'Space Mono'}}>No market condition tags logged yet.</div>}

  );
}

// ── Calendar page ─────────────────────────────────────────────────────────────
function CalendarPage({version, year}) {
  const [trades,      setTrades]      = React.useState(null);
  const [currency,    setCurrency]    = React.useState('ALL');
  const [currencies,  setCurrencies]  = React.useState(['USD']);
  const [cur,         setCur]         = React.useState(()=>{ const n=new Date(); return {y:n.getFullYear(),m:n.getMonth()}; });
  const [selectedDay, setSelectedDay] = React.useState(null);

  React.useEffect(()=>{
    Promise.all([api(`/portfolio?year=${year}`), api(`/metrics?currency=ALL&year=${year}`)]).then(([p,met])=>{
      setTrades(p.closed_trades||[]);
      setCurrencies(met.currencies||['USD']);
    });
  },[version]);

  if (!trades) return <Spinner/>;

  const EXCL=new Set(['SGOV','BOXX']);
  const FX=7.8;
  const toUsd = t => t.currency==='HKD' ? t.pnl/FX : t.pnl;
  const effectivePnl = t => currency==='ALL' ? toUsd(t) : t.pnl;

  const filtered=trades.filter(t=>(currency==='ALL'||t.currency===currency)&&!EXCL.has(t.symbol));
  const dayPnl={};
  filtered.forEach(t=>{ dayPnl[t.exit_date]=(dayPnl[t.exit_date]||0)+effectivePnl(t); });

  const {y,m}=cur;
  const firstDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const monthLabel=new Date(y,m,1).toLocaleString('en-US',{month:'long',year:'numeric'});
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({d,ds,pnl:dayPnl[ds]??null});
  }
  while(cells.length%7) cells.push(null);

  const maxAbs=Math.max(...Object.values(dayPnl).map(Math.abs),1);
  const displayCcy=currency==='ALL'?'USD':currency;
  const monthPrefix=`${y}-${String(m+1).padStart(2,'0')}`;
  const monthTrades=filtered.filter(t=>t.exit_date.startsWith(monthPrefix));
  const monthPnl=monthTrades.reduce((s,t)=>s+effectivePnl(t),0);
  const monthWins=monthTrades.filter(t=>t.pnl>0).length;

  const prev=()=>setCur(({y,m})=>m===0?{y:y-1,m:11}:{y,m:m-1});
  const next=()=>setCur(({y,m})=>m===11?{y:y+1,m:0}:{y,m:m+1});

  return (
    <div style={{flex:1,overflow:'auto',padding:'20px 24px'}}>
      {/* ── Top bar: currency · nav · monthly stats all in one row ── */}
      <div style={{display:'flex',alignItems:'center',gap:16,marginBottom:16,flexWrap:'wrap'}}>
        {currencies.length>1&&(
          <div style={{display:'flex',gap:4,flexShrink:0}}>
            {currencies.map(c=>(
              <button key={c} onClick={()=>setCurrency(c)} style={{padding:'4px 10px',fontSize:10,borderRadius:4,border:'none',background:currency===c?`${ACCENT}22`:'rgba(255,255,255,0.04)',color:currency===c?ACCENT:'#5a6478',fontFamily:'Space Mono',fontWeight:700}}>{c}</button>
            ))}
          </div>
        )}
        <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
          <button onClick={prev} style={{background:'none',border:'none',color:'#5a6478',cursor:'pointer',fontSize:20,lineHeight:1,padding:'0 4px'}}>‹</button>
          <div style={{fontFamily:'Space Grotesk',fontWeight:600,color:'#c8d0e0',fontSize:18,minWidth:180,textAlign:'center'}}>{monthLabel}</div>
          <button onClick={next} style={{background:'none',border:'none',color:'#5a6478',cursor:'pointer',fontSize:20,lineHeight:1,padding:'0 4px'}}>›</button>
        </div>
        {monthTrades.length>0&&<>
          <div style={{width:'1px',height:28,background:'rgba(255,255,255,0.07)',flexShrink:0}}/>
          <div style={{display:'flex',gap:20,alignItems:'center',flexWrap:'wrap'}}>
            <div><div style={S.hdr}>Month P&L</div><div style={{fontFamily:'Space Mono',fontSize:13,fontWeight:700,color:pnlColor(monthPnl)}}>{(monthPnl>=0?'+':'')+fmt(monthPnl,2)} {displayCcy}</div></div>
            <div><div style={S.hdr}>Trades</div><div style={{fontFamily:'Space Mono',fontSize:13,fontWeight:700,color:'#c8d0e0'}}>{monthTrades.length}</div></div>
            <div><div style={S.hdr}>Win Rate</div><div style={{fontFamily:'Space Mono',fontSize:13,fontWeight:700,color:monthWins/monthTrades.length>=0.4?GREEN:RED}}>{Math.round(monthWins/monthTrades.length*100)}%</div></div>
          </div>
        </>}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:3}}>
        {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>(
          <div key={d} style={{textAlign:'center',fontFamily:'Space Grotesk',fontSize:9,color:'#5a6478',letterSpacing:'.06em',padding:'4px 0'}}>{d}</div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
        {cells.map((cell,i)=>{
          if(!cell) return <div key={i}/>;
          const {d,ds,pnl}=cell, has=pnl!==null;
          const intensity=has?Math.sqrt(Math.abs(pnl)/maxAbs):0;
          const isWin=pnl>0;
          const bg=has?(isWin?`rgba(5,150,144,${0.25+intensity*0.5})`:`rgba(206,49,75,${0.25+intensity*0.5})`):'rgba(255,255,255,0.02)';
          const isSel=selectedDay===ds;
          const dayTrades=has?(filtered.filter(t=>t.exit_date===ds)):[];
          const tags=[...new Set(dayTrades.map(t=>t.setup_tag).filter(Boolean))];
          const MAX_TAGS=2;
          return (
            <div key={i} onClick={()=>setSelectedDay(isSel?null:ds)}
              style={{background:bg,borderRadius:6,padding:'6px 8px',minHeight:80,display:'flex',
                flexDirection:'column',gap:2,
                cursor:has?'pointer':'default',
                outline:isSel?`2px solid rgba(255,255,255,0.6)`:'2px solid transparent',
                outlineOffset:'-1px',
              }}>
              <div style={{textAlign:'right',fontFamily:'Space Grotesk',fontSize:12,fontWeight:600,
                color:has?'rgba(255,255,255,0.9)':'#3a4455'}}>{d}</div>
              {has&&<>
                <div style={{fontFamily:'Space Mono',fontSize:11,fontWeight:700,color:'#ffffff',lineHeight:1.2}}>
                  {pnl<0?'-':''}${fmt(Math.abs(pnl),2)}
                </div>
                <div style={{fontFamily:'Space Grotesk',fontSize:9,color:'rgba(255,255,255,0.65)'}}>
                  {dayTrades.length} Trade{dayTrades.length!==1?'s':''}
                </div>
                {tags.length>0&&(
                  <div style={{display:'flex',flexWrap:'wrap',gap:2,marginTop:1}}>
                    {tags.slice(0,MAX_TAGS).map(tag=>(
                      <span key={tag} style={{
                        fontSize:8,fontFamily:'Space Grotesk',fontWeight:700,
                        padding:'1px 5px',borderRadius:3,
                        background:'rgba(0,0,0,0.25)',color:'rgba(255,255,255,0.9)',
                        letterSpacing:'.03em',textTransform:'uppercase',whiteSpace:'nowrap',
                      }}>{tag}</span>
                    ))}
                    {tags.length>MAX_TAGS&&(
                      <span style={{fontSize:8,fontFamily:'Space Grotesk',color:'rgba(255,255,255,0.6)',padding:'1px 2px'}}>
                        +{tags.length-MAX_TAGS} more
                      </span>
                    )}
                  </div>
                )}
              </>}
            </div>
          );
        })}
      </div>

      {/* ── Day detail panel ── */}
      {(()=>{
        if (!selectedDay) return null;
        const dayTrades = filtered.filter(t=>t.exit_date===selectedDay);
        if (!dayTrades.length) return null;
        const dayLabel = new Date(selectedDay+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
        const dayTotal = dayTrades.reduce((s,t)=>s+effectivePnl(t),0);
        return (
          <div style={{marginTop:20,background:'rgba(255,255,255,0.03)',borderRadius:10,padding:'16px 18px',border:`1px solid ${ACCENT}33`}}>
            <div style={{display:'flex',alignItems:'baseline',gap:12,marginBottom:14}}>
              <div style={{fontFamily:'Space Grotesk',fontWeight:600,color:'#c8d0e0',fontSize:13}}>{dayLabel}</div>
              <div style={{fontFamily:'Space Mono',fontWeight:700,fontSize:13,color:pnlColor(dayTotal)}}>{(dayTotal>=0?'+':'')+fmt(dayTotal,2)} {displayCcy}</div>
              <div style={{flex:1}}/>
              <button onClick={()=>setSelectedDay(null)} style={{background:'none',border:'none',color:'#5a6478',cursor:'pointer',fontSize:16,lineHeight:1}}>×</button>
            </div>
            <table style={{width:'100%'}}>
              <thead><tr style={{borderBottom:'1px solid rgba(255,255,255,0.07)'}}>
                {['Symbol','Dir','Entry Date','Exit Date','Qty','Avg Entry','Avg Exit','% Ret','R','P&L'].map(h=>(
                  <th key={h} style={{...S.hdr,padding:'4px 8px',textAlign:h==='Symbol'||h==='Dir'?'left':'right',fontWeight:600}}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {dayTrades.map((t,i)=>(
                  <tr key={i} style={{borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:11,fontWeight:700,color:ACCENT}}>{t.symbol}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:10,color:t.direction==='LONG'?GREEN:RED}}>{t.direction==='LONG'?'L':'S'}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:10,color:'#5a6478',textAlign:'right'}}>{t.entry_date}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:10,color:'#5a6478',textAlign:'right'}}>{t.exit_date}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:10,color:'#c8d0e0',textAlign:'right'}}>{fmt(t.quantity,0)}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:10,color:'#c8d0e0',textAlign:'right'}}>{fmt(t.avg_entry,2)}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:10,color:'#c8d0e0',textAlign:'right'}}>{fmt(t.avg_exit,2)}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:10,fontWeight:700,color:t.pct_return>=0?GREEN:RED,textAlign:'right'}}>{t.pct_return!=null?(t.pct_return>=0?'+':'')+fmt(t.pct_return,2)+'%':'—'}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:10,color:t.r_multiple!=null?(t.r_multiple>=0?GREEN:RED):'#5a6478',textAlign:'right'}}>{t.r_multiple!=null?fmt(t.r_multiple,2)+'R':'—'}</td>
                    <td style={{padding:'7px 8px',fontFamily:'Space Mono',fontSize:11,fontWeight:700,color:pnlColor(t.pnl),textAlign:'right'}}>{(t.pnl>=0?'+':'')+fmt(t.pnl,2)} {t.currency}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      })()}
    </div>
  );
}

// ── Position Sizing Calculator ────────────────────────────────────────────────
function CalcPanel({onClose}) {
  const [dir,    setDir]    = React.useState('LONG');
  const [qty,    setQty]    = React.useState('');
  const [entry,  setEntry]  = React.useState('');
  const [target, setTarget] = React.useState('');
  const [stop,   setStop]   = React.useState('');
  const [riskPct,setRiskPct]= React.useState('');
  const [portfolio, setPortfolio] = React.useState(null);
  const [pos, setPos] = React.useState({top:60, right:20, left:null});
  const dragRef = React.useRef(null);

  React.useEffect(()=>{
    api('/portfolio').then(d=>{
      const t = d.account_totals || {};
      setPortfolio(round2((t.USD||0) + (t.HKD||0) / 7.8));
    }).catch(()=>{});
  }, []);

  React.useEffect(()=>{
    const onKey = e => { if (e.key==='Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const onDragStart = e => {
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const el = dragRef.current;
    const rect = el.getBoundingClientRect();
    const offX = startX - rect.left, offY = startY - rect.top;
    const onMove = ev => {
      setPos({top: ev.clientY - offY, left: ev.clientX - offX, right: null});
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  const round2 = v => Math.round(v * 100) / 100;
  const E = parseFloat(entry), S = parseFloat(stop);
  const Q = parseInt(qty), R = parseFloat(riskPct), T = parseFloat(target);
  const P = portfolio;

  const hasQty   = qty   !== '' && Q > 0;
  const hasEntry = entry !== '' && E > 0;
  const hasStop  = stop  !== '' && !isNaN(S);
  const hasRisk  = riskPct !== '' && R > 0;

  // Auto-detect which field to solve: the one that is empty while the others are filled
  let mode = null;
  if (!hasQty  && hasEntry && hasStop && hasRisk && P) mode = 'qty';
  if (!hasStop && hasEntry && hasQty  && hasRisk && P) mode = 'stop';
  if (!hasRisk && hasEntry && hasStop && hasQty  && P) mode = 'risk';

  const riskPerUnit = (hasEntry && hasStop) ? (dir==='LONG' ? E - S : S - E) : null;

  let solvedQty=null, solvedStop=null, solvedRisk=null;
  if (mode==='risk' && Q>0 && riskPerUnit!=null && riskPerUnit>0)
    solvedRisk = round2((Q * riskPerUnit / P) * 100);
  if (mode==='qty'  && R>0 && riskPerUnit!=null && riskPerUnit>0)
    solvedQty  = Math.floor((P * R / 100) / riskPerUnit);
  if (mode==='stop' && Q>0 && R>0 && hasEntry) {
    const riskAmt = P * R / 100;
    solvedStop = round2(dir==='LONG' ? E - riskAmt/Q : E + riskAmt/Q);
  }

  const displayQty   = mode==='qty'  ? solvedQty  : (hasQty  ? Q : null);
  const displayStop  = mode==='stop' ? solvedStop  : (hasStop ? S : null);
  const displayRisk  = mode==='risk' ? solvedRisk  : (hasRisk ? R : null);
  const displayEntry = hasEntry ? E : null;

  const riskAmt = (displayQty&&displayEntry&&displayStop!=null)
    ? round2(Math.abs(displayEntry-displayStop)*displayQty) : null;
  const notional = (displayQty&&displayEntry) ? round2(displayQty*displayEntry) : null;
  const notionalPct = (notional&&P) ? round2(notional/P*100) : null;
  const rr = (displayEntry&&displayStop!=null&&T)
    ? round2(Math.abs(T-displayEntry)/Math.abs(displayEntry-displayStop)) : null;

  const inSt = {
    width:'100%',padding:'5px 8px',background:'#0a0d12',
    border:'1px solid rgba(255,255,255,0.12)',borderRadius:4,
    color:'#c8d0e0',fontSize:12,fontFamily:'Space Mono',outline:'none',boxSizing:'border-box',
  };
  const solvedSt = {...inSt, background:'rgba(68,153,255,0.08)', border:`1px solid ${ACCENT}55`, color:ACCENT, fontWeight:700};
  const dirBtn = active => ({
    flex:1,padding:'5px 0',fontSize:11,borderRadius:4,border:'none',cursor:'pointer',
    fontFamily:'Space Mono',fontWeight:700,
    background:active?(dir==='LONG'?`${GREEN}22`:`${RED}22`):'rgba(255,255,255,0.04)',
    color:active?(dir==='LONG'?GREEN:RED):'#5a6478',
  });

  const Row = ({label, children}) => (
    <div style={{marginBottom:8}}>
      <div style={{...S.hdr,marginBottom:3}}>{label}</div>
      {children}
    </div>
  );

  const panelStyle = {position:'fixed',top:pos.top,width:300,zIndex:1000,
    background:'#0f1318',border:'1px solid rgba(255,255,255,0.1)',
    borderRadius:10,boxShadow:'0 8px 32px rgba(0,0,0,0.6)',padding:'16px',
    fontFamily:'Space Grotesk',
    ...(pos.left!=null ? {left:pos.left} : {right:20}),
  };

  return (
    <div ref={dragRef} style={panelStyle}>

      {/* Header — drag handle */}
      <div onMouseDown={onDragStart}
        style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,
          cursor:'grab',userSelect:'none'}}>
        <div style={{fontSize:13,fontWeight:600,color:'#c8d0e0'}}>Position Sizing</div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          {P && <span style={{fontSize:10,color:'#5a6478',fontFamily:'Space Mono'}}>${fmt(P,0)} USD</span>}
          <button onClick={onClose} style={{background:'none',border:'none',color:'#5a6478',cursor:'pointer',fontSize:16,lineHeight:1}}>×</button>
        </div>
      </div>

      {/* Direction */}
      <div style={{display:'flex',gap:4,marginBottom:14}}>
        <button style={dirBtn(dir==='LONG')}  onClick={()=>setDir('LONG')}>LONG</button>
        <button style={dirBtn(dir==='SHORT')} onClick={()=>setDir('SHORT')}>SHORT</button>
      </div>

      {/* Fields in order: Qty, Entry, Target, Stop, Risk% */}
      <Row label="Quantity">
        {mode==='qty'
          ? <div style={{...solvedSt,padding:'5px 8px',borderRadius:4,fontSize:12}}>{solvedQty!=null?solvedQty:'—'}</div>
          : <input style={inSt} type="number" step="1" min="1" placeholder="e.g. 500"
              value={qty} onChange={e=>setQty(e.target.value)}/>}
      </Row>
      <Row label="Entry Price">
        <input style={inSt} type="number" step="any" placeholder="e.g. 148.50"
          value={entry} onChange={e=>setEntry(e.target.value)}/>
      </Row>
      <Row label="Target Price (optional)">
        <input style={inSt} type="number" step="any" placeholder="e.g. 155.00"
          value={target} onChange={e=>setTarget(e.target.value)}/>
      </Row>
      <Row label="Stop Loss">
        {mode==='stop'
          ? <div style={{...solvedSt,padding:'5px 8px',borderRadius:4,fontSize:12}}>{solvedStop!=null?solvedStop:'—'}</div>
          : <input style={inSt} type="number" step="any" placeholder="e.g. 144.00"
              value={stop} onChange={e=>setStop(e.target.value)}/>}
      </Row>
      <Row label="Risk %">
        {mode==='risk'
          ? <div style={{...solvedSt,padding:'5px 8px',borderRadius:4,fontSize:12}}>{solvedRisk!=null?solvedRisk+'%':'—'}</div>
          : <input style={inSt} type="number" step="any" placeholder="e.g. 0.5"
              value={riskPct} onChange={e=>setRiskPct(e.target.value)}/>}
      </Row>

      {/* Results */}
      {(riskAmt!=null||notional!=null||rr!=null) && (
        <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid rgba(255,255,255,0.08)',display:'flex',flexDirection:'column',gap:6}}>
          {/* Risk $ */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
            <span style={{fontSize:11,color:'#5a6478',fontFamily:'Space Grotesk'}}>Risk $</span>
            <span style={{fontFamily:'Space Mono',fontWeight:700,fontSize:13,color:RED}}>
              {riskAmt!=null ? `$${fmt(riskAmt,0)}` : '—'}
              {displayRisk!=null && <span style={{fontSize:10,fontWeight:400,color:'#a0536a',marginLeft:6}}>({displayRisk}%)</span>}
            </span>
          </div>
          {/* Notional */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
            <span style={{fontSize:11,color:'#5a6478',fontFamily:'Space Grotesk'}}>Notional</span>
            <span style={{fontFamily:'Space Mono',fontWeight:700,fontSize:13,color:'#c8d0e0'}}>
              {notional!=null ? `$${fmt(notional,0)}` : '—'}
              {notionalPct!=null && <span style={{fontSize:10,fontWeight:400,color:'#5a6478',marginLeft:6}}>({notionalPct}%)</span>}
            </span>
          </div>
          {/* R/R */}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
            <span style={{fontSize:11,color:'#5a6478',fontFamily:'Space Grotesk'}}>R / R</span>
            <span style={{fontFamily:'Space Mono',fontWeight:700,fontSize:13,color:rr!=null&&rr>=1?GREEN:'#c8d0e0'}}>
              {rr!=null ? `${rr} : 1` : '—'}
            </span>
          </div>
        </div>
      )}
    </div>
  );
}

// ── App root ──────────────────────────────────────────────────────────────────
function App() {
  const [nav,          setNav]          = React.useState('dashboard');
  const [mounted,      setMounted]      = React.useState(()=>new Set(['dashboard','journal','analysis','calendar','data']));
  const [version,      setVersion]      = React.useState(0);
  const [selectedYear, setSelectedYear] = React.useState(new Date().getFullYear());
  const [calcOpen,     setCalcOpen]     = React.useState(false);
  const NAV_ITEMS = [{id:'dashboard',label:'Dash'},{id:'journal',label:'Journal'},{id:'analysis',label:'Analysis'},{id:'calendar',label:'Calendar'},{id:'data',label:'Data'}];

  React.useEffect(() => {
    const onKey = e => { if (e.key === 'F1') { e.preventDefault(); setCalcOpen(o => !o); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const goNav = id => {
    setMounted(prev => { const n=new Set(prev); n.add(id); return n; });
    setNav(id);
  };
  const bumpVersion = () => setVersion(v => v + 1);
  const changeYear = y => { setSelectedYear(y); setVersion(v => v + 1); };

  const TAB = {
    dashboard: <Dashboard version={version} year={selectedYear}/>,
    journal:   <Journal version={version} year={selectedYear}/>,
    analysis:  <Analysis version={version} year={selectedYear}/>,
    calendar:  <CalendarPage version={version} year={selectedYear}/>,
    data:      <DataPage onDataChange={bumpVersion}/>,
  };

  return (
    <div className="app-root" style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
      <TopNav active={nav} onNav={goNav} year={selectedYear} onYearChange={changeYear}/>
      <div className="app-main" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
        {Object.keys(TAB).map(id=> mounted.has(id) && (
          <div key={id} style={{display:nav===id?'contents':'none'}}>
            {TAB[id]}
          </div>
        ))}
      </div>
      {calcOpen && <CalcPanel onClose={()=>setCalcOpen(false)}/>}
      {/* Mobile bottom nav */}
      <div className="mobile-nav">
        {NAV_ITEMS.map(n=>(
          <button key={n.id} onClick={()=>goNav(n.id)} style={{
            flex:1,background:'transparent',border:'none',
            color:nav===n.id?ACCENT:'#5a6478',
            fontSize:9,fontFamily:'Space Grotesk',fontWeight:600,letterSpacing:'.06em',
            textTransform:'uppercase',padding:'8px 4px',borderTop:nav===n.id?`2px solid ${ACCENT}`:'2px solid transparent',
          }}>{n.label}</button>
        ))}
      </div>
    </div>
  );
}

try {
  const _boot = document.getElementById('boot');
  if (_boot) _boot.style.display = 'none';
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
} catch(e) {
  const b = document.getElementById('boot');
  if (b) { b.style.display='flex'; b.style.flexDirection='column'; b.style.gap='12px'; b.innerHTML = '<div style="color:#CE314B;font-size:14px">Startup error</div><div style="max-width:500px;text-align:center;line-height:1.6;font-size:11px">'+String(e)+'</div>'; }
}
</script>
</body>
