<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="/static/fonts/fonts.css" rel="stylesheet">
<script src="/static/vendor/react.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden}
body{background:#090c10;color:#c8d0e0;font-family:'Space Grotesk',sans-serif;font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}

button{font-family:inherit;cursor:pointer}

input:focus,select:focus,textarea:focus{border-color:rgba(68,153,255,0.5)}
select option{background:#141a24}
table{width:100%;border-collapse:collapse}
th{font:500 10px/1 'Space Grotesk',sans-serif;color:#5a6478;text-transform:uppercase;letter-spacing:.08em;padding:8px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06)}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.04);font:400 12px/1 'Space Mono',monospace;color:#5a6478}
tr:hover td{background:rgba(255,255,255,0.02)}
.mobile-nav{display:none}
@media(max-width:640px){
  html,body,#root{height:auto;overflow-y:auto}
  .app-root{flex-direction:column!important;height:auto!important;overflow-y:auto!important}
  .app-main{overflow:visible!important;height:auto!important;min-height:100vh}
  .mobile-nav{display:flex!important;position:fixed;bottom:0;left:0;right:0;
    background:#090c10;border-top:1px solid rgba(255,255,255,0.08);z-index:100}
  .dash-top{flex-direction:column!important;overflow:visible!important;height:auto!important;flex:none!important}
  .dash-kpi{width:100%!important;display:grid!important;grid-template-columns:repeat(2,1fr)!important;overflow:visible!important;flex:none!important}
  .dash-mid{height:220px!important;flex:none!important}
  .dash-equity{height:160px!important;flex:none!important;padding:12px!important}
  .dash-positions{height:auto!important;overflow-x:auto!important;padding:12px!important;flex:none!important}
  .analysis-content{padding:12px!important}
}
</style>
</head>
<body>
<div id="boot" style="position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#090c10;color:#5a6478;font-family:monospace;font-size:13px;z-index:9999;gap:12px">Starting…</div>
<div id="root"></div>
<script>
window.onerror = function(msg, src, line, col, err) {
  var b = document.getElementById('boot');
  if (!b) return;
  b.style.display = 'flex';
  b.innerHTML = '<div style="color:#CE314B;font-size:14px;margin-bottom:8px">Error</div>'
    + '<div style="color:#c8d0e0;font-size:12px;max-width:600px;word-break:break-all;text-align:center">' + String(msg) + '</div>'
    + '<div style="color:#5a6478;font-size:10px;margin-top:4px">' + String(src) + ' line ' + line + '</div>';
};
window.addEventListener('unhandledrejection', function(e) {
  var b = document.getElementById('boot');
  if (!b) return;
  b.style.display = 'flex';
  b.innerHTML = '<div style="color:#CE314B;font-size:14px;margin-bottom:8px">Unhandled Promise Error</div>'
    + '<div style="color:#c8d0e0;font-size:12px;max-width:600px;word-break:break-all;text-align:center">' + String(e.reason) + '</div>';
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'F11') {
    e.preventDefault();
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.toggle_fullscreen();
    }
  }
});
</script>
<script type="text/babel">
const API    = '/api';
const ACCENT = '#4499ff';
const GREEN  = '#059690';
const RED    = '#CE314B';
const YELLOW = '#f5b844';

const api = async (path, opts={}) => {
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};

const fmt     = (n, dec=0) => n == null ? '—' : Number(n).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec});
const pct     = n => n == null ? '—' : (n*100).toFixed(1)+'%';
const pnlColor = v => v > 0 ? GREEN : v < 0 ? RED : '#c8d0e0';

// Sort an array of objects by a key; nulls always sink to bottom
const applySort = (rows, col, dir) => {
  if (!col) return rows;
  return [...rows].sort((a, b) => {
    const av = a[col], bv = b[col];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
    return dir === 'asc' ? cmp : -cmp;
  });
};

const S = {
  hdr: {fontSize:10,color:'#5a6478',textTransform:'uppercase',letterSpacing:'.08em',fontFamily:'Space Grotesk',fontWeight:500,marginBottom:6},
  val: {fontSize:20,fontFamily:'Space Mono',fontWeight:700,color:'#c8d0e0'},
  ticker: {font:'700 13px/1 "Space Mono",monospace',color:'#c8d0e0'},
  btn: (primary) => ({
    padding:'7px 16px',
    background: primary ? ACCENT : 'rgba(255,255,255,0.07)',
    border:'none',borderRadius:6,
    color: primary ? '#090c10' : '#c8d0e0',
    fontSize:12,fontFamily:'Space Grotesk',fontWeight: primary ? 600 : 400,
  }),
};

// ── Top Nav ───────────────────────────────────────────────────────────────────
const NAV = [
  {id:'dashboard', label:'Dashboard'},
  {id:'calendar',  label:'Calendar'},
  {id:'journal',   label:'Journal'},
  {id:'analysis',  label:'Analysis'},
  {id:'data',      label:'Data'},
];

function TopNav({active, onNav, year, onYearChange}) {
  const [editing, setEditing] = React.useState(false);
  const [draft,   setDraft]   = React.useState('');
  const btnStyle = {background:'none',border:'none',color:'#5a6478',cursor:'pointer',fontSize:13,lineHeight:1,padding:'0 3px'};
  const commit = val => {
    const n = parseInt(val);
    if (n >= 2000 && n <= 2099) onYearChange(n);
    setEditing(false);
  };
  return (
    <div style={{height:44,display:'flex',alignItems:'center',background:'#090c10',
      borderBottom:'1px solid rgba(255,255,255,0.06)',flexShrink:0,padding:'0 20px'}}>
      <div style={{display:'flex',alignItems:'center',marginRight:32,flexShrink:0}}>
        <img src="/static/Chartingwoof logo ( Big Head).png" alt="ChartingWoof"
          style={{height:30,filter:'invert(1)'}}
          onError={e=>e.target.style.display='none'}/>
      </div>
      <div style={{flex:1,display:'flex',alignItems:'stretch',justifyContent:'flex-start',height:44}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>onNav(n.id)} style={{
            padding:'0 18px',background:'transparent',border:'none',
            borderBottom: active===n.id ? `2px solid ${ACCENT}` : '2px solid transparent',
            color: active===n.id ? '#c8d0e0' : '#5a6478',
            fontSize:10,fontFamily:'Space Grotesk',fontWeight:500,
            letterSpacing:'.08em',textTransform:'uppercase',cursor:'pointer',
          }}>{n.label}</button>
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
        <button style={btnStyle} onClick={()=>onYearChange(year-1)}>◀</button>
        {editing ? (
          <input autoFocus type="number" defaultValue={draft}
            style={{width:50,textAlign:'center',fontFamily:'Space Mono',fontSize:11,background:'#0d1117',
              border:'1px solid rgba(255,255,255,0.12)',borderRadius:3,color:'#c8d0e0',padding:'2px 4px'}}
            onBlur={e=>commit(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter') commit(e.target.value); if(e.key==='Escape') setEditing(false); }}/>
        ) : (
          <span onClick={()=>{ setDraft(String(year)); setEditing(true); }}
            style={{fontSize:11,color:'#c8d0e0',fontFamily:'Space Mono',letterSpacing:'.06em',
              cursor:'text',padding:'2px 6px',borderRadius:3,border:'1px solid transparent',
              userSelect:'none'}}
            title="Click to edit year">
            {year}
          </span>
        )}
        <button style={btnStyle} onClick={()=>onYearChange(year+1)}>▶</button>
      </div>
    </div>
  );
}

// ── Tab bar ───────────────────────────────────────────────────────────────────
function TabBar({tabs, active, onChange}) {
  return (
    <div style={{display:'flex',borderBottom:'1px solid rgba(255,255,255,0.06)'}}>
      {tabs.map(t => (
        <button key={t} onClick={()=>onChange(t)} style={{
          padding:'10px 18px',background:'transparent',border:'none',
          borderBottom: active===t ? `2px solid ${ACCENT}` : '2px solid transparent',
          color: active===t ? ACCENT : '#5a6478',
          fontSize:10,fontFamily:'Space Grotesk',fontWeight:500,
          letterSpacing:'.08em',textTransform:'uppercase',marginBottom:-1,
        }}>{t}</button>
      ))}
    </div>
  );
}

// ── Metric Strip ──────────────────────────────────────────────────────────────
function MetricStrip({metrics, currency}) {
  if (!metrics) return null;
  const wr = metrics.win_rate || 0;
  const wrColor = wr >= 0.4 ? GREEN : RED;
  const streakColor = metrics.current_streak?.type==='W' ? GREEN : metrics.current_streak?.type==='L' ? RED : '#c8d0e0';
  const streakVal = metrics.current_streak?.count ? `${metrics.current_streak.count}${metrics.current_streak.type}` : '—';
  const sep = {borderRight:'1px solid rgba(255,255,255,0.06)'};
  const cell = {flex:1,display:'flex',flexDirection:'column',justifyContent:'center',padding:'0 20px'};
  // Inline donut constants
  const r=16, cx=22, cy=22, sw=4, circ=2*Math.PI*r;
  const filled = circ * Math.min(Math.max(wr,0),1);
  return (
    <div style={{height:72,display:'flex',background:'#0b0e14',borderBottom:'1px solid rgba(255,255,255,0.06)',flexShrink:0}}>
      {/* Total P&L */}
      <div style={{...cell,...sep}}>
        <div style={S.hdr}>Total P&L</div>
        <div style={{fontSize:18,fontFamily:'Space Mono',fontWeight:700,color:pnlColor(metrics.total_pnl)}}>
          {(metrics.total_pnl>=0?'+':'')+fmt(metrics.total_pnl,2)+' '+currency}
        </div>
      </div>
      {/* Win Rate with donut */}
      <div style={{...sep,flex:1,display:'flex',alignItems:'center',padding:'0 20px',gap:14}}>
        <svg width={44} height={44} style={{flexShrink:0}}>
          <defs>
            <linearGradient id="wr-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stopColor="#ffffff" stopOpacity="0.9"/>
              <stop offset="100%" stopColor={wrColor} stopOpacity="1"/>
            </linearGradient>
          </defs>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={sw}/>
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="url(#wr-grad)" strokeWidth={sw}
            strokeDasharray={`${filled} ${circ-filled}`} strokeDashoffset={circ*0.25} strokeLinecap="round"/>
          <text x={cx} y={cy+4} textAnchor="middle" fill="#c8d0e0" fontSize={10} fontFamily="Space Mono" fontWeight="700">
            {Math.round(wr*100)}%
          </text>
        </svg>
        <div>
          <div style={S.hdr}>Win Rate</div>
          <div style={{fontSize:18,fontFamily:'Space Mono',fontWeight:700,color:wrColor}}>{pct(wr)}</div>
        </div>
      </div>
      {/* Current Streak */}
      <div style={cell}>
        <div style={S.hdr}>Current Streak</div>
        <div style={{fontSize:18,fontFamily:'Space Mono',fontWeight:700,color:streakColor}}>{streakVal}</div>
      </div>
    </div>
  );
}

// ── Donut Chart ───────────────────────────────────────────────────────────────
function DonutChart({fillRatio, displayVal, label, color, size=80}) {
  const r=size*0.36, cx=size/2, cy=size/2, sw=size*0.09;
  const circ=2*Math.PI*r, filled=circ*Math.min(Math.max(fillRatio||0,0),1);
  const fs=size*0.15;
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
      <svg width={size} height={size}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={sw}/>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth={sw}
          strokeDasharray={`${filled} ${circ-filled}`} strokeDashoffset={circ*0.25} strokeLinecap="round"/>
        <text x={cx} y={cy+fs*0.4} textAnchor="middle" fill="#c8d0e0" fontSize={fs} fontFamily="Space Mono" fontWeight="700">
          {displayVal}
        </text>
      </svg>
      <div style={{fontSize:9,color:'#5a6478',fontFamily:'Space Grotesk',fontWeight:500,letterSpacing:'.06em',textTransform:'uppercase'}}>{label}</div>
    </div>
  );
}

// ── Setup Performance Panel (replaces Panel A + B) ────────────────────────────
function SetupPerformancePanel({currency}) {
  const [mode, setMode] = React.useState('$');
  const [tags, setTags]   = React.useState(null);
  const ccy = currency === 'ALL' ? 'USD' : currency;
  React.useEffect(()=>{
    setTags(null);
    api(`/stats/setup_tags?currency=${ccy}`).then(setTags).catch(()=>setTags({}));
  }, [ccy]);
  const entries = tags ? Object.entries(tags) : [];
  const rows = entries
    .map(([tag,v])=>({
      label: tag,
      pnl: mode==='$' ? (v.avg_pnl||0) : (v.avg_pct||0),
      sub: `${v.count}T`,
    }))
    .sort((a,b)=>b.pnl-a.pnl);
  const fmtVal = mode==='$'
    ? (pnl,isPos) => (isPos?'+':'')+fmt(pnl,0)
    : (pnl,isPos) => (isPos?'+':'')+fmt(pnl,1)+'%';
  return (
    <div style={{flex:1,overflow:'hidden',padding:'10px 12px',display:'flex',flexDirection:'column',minHeight:0}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8,flexShrink:0}}>
        <div style={S.hdr}>Setup Performance</div>
        <div style={{display:'flex',gap:2}}>
          {['$','%'].map(m=>(
            <button key={m} onClick={()=>setMode(m)} style={{
              padding:'2px 8px',fontSize:9,borderRadius:3,border:'none',cursor:'pointer',
              background:mode===m?`${ACCENT}22`:'rgba(255,255,255,0.04)',
              color:mode===m?ACCENT:'#5a6478',fontFamily:'Space Mono',fontWeight:700,
            }}>{m}</button>
          ))}
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',overflowX:'hidden'}}>
        {!tags
          ? <div style={{color:'#5a6478',fontSize:10,fontFamily:'Space Mono'}}>Loading…</div>
          : rows.length===0
            ? <div style={{color:'#5a6478',fontSize:10,fontFamily:'Space Mono'}}>No setup tags logged yet.</div>
            : <DivergingBars rows={rows} labelWidth={52} fmtVal={fmtVal}/>
        }
      </div>
    </div>
  );
}

// ── Panel C: Diverging P&L bar chart by symbol ────────────────────────────────
function PanelC({trades}) {
  const [hovered, setHovered] = React.useState(null);
  if (!trades||!trades.length) return <div style={{flex:1}}/>;
  const recent = trades.slice(0,10);
  const logMax = Math.log1p(Math.max(...recent.map(t=>Math.abs(t.pnl)), 1));
  return (
    <div style={{flex:1,overflow:'hidden',padding:'14px 20px',display:'flex',flexDirection:'column',minHeight:0}}>
      <div style={{fontSize:9.5,fontWeight:600,color:'#323d52',textTransform:'uppercase',letterSpacing:'0.1em',fontFamily:'Space Grotesk',marginBottom:10,flexShrink:0}}>Recent Trades</div>
      <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:3}}>
        {recent.map((t,i)=>{
          const win = t.pnl >= 0;
          const barW = Math.log1p(Math.abs(t.pnl)) / logMax;
          const pctVal = t.pct_return != null ? ((t.pct_return>=0?'+':'')+fmt(t.pct_return,1)+'%') : '—';
          const pnlLabel = (t.pnl>=0?'+':'')+fmt(t.pnl,0);
          const dateLabel = (t.exit_date||'').slice(5);
          const isHov = hovered===i;
          return (
            <div key={i} style={{
              display:'flex',alignItems:'center',gap:9,
              padding:'5px 10px',borderRadius:5,flexShrink:0,height:30,
              background:'#15171f',
              border:`1px solid ${isHov?'rgba(255,255,255,0.10)':'rgba(255,255,255,0.045)'}`,
              transition:'border-color 0.12s',
            }}
            onMouseEnter={()=>setHovered(i)} onMouseLeave={()=>setHovered(null)}>
              <div style={{width:5,height:5,borderRadius:'50%',flexShrink:0,background:win?GREEN:RED}}/>
              <span style={{fontFamily:'Space Mono',fontSize:11,fontWeight:700,color:'#7aabff',width:50,flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.symbol}</span>
              <span style={{fontFamily:'Space Grotesk',fontSize:9,color:'#323d52',width:32,flexShrink:0}}>{dateLabel}</span>
              <div style={{flex:1,height:4,background:'rgba(255,255,255,0.05)',borderRadius:2,overflow:'hidden'}}>
                <div style={{width:`${barW*100}%`,height:'100%',background:win?GREEN:RED,opacity:0.75,borderRadius:2}}/>
              </div>
              <span style={{fontFamily:'Space Mono',fontSize:10,fontWeight:700,color:win?GREEN:RED,width:46,textAlign:'right',flexShrink:0}}>{pctVal}</span>
              <span style={{fontFamily:'Space Mono',fontSize:11,fontWeight:700,color:win?GREEN:RED,width:68,textAlign:'right',flexShrink:0}}>{pnlLabel}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Holding Period Bar Chart ───────────────────────────────────────────────────
function HoldingBarChart({trades}) {
  const buckets=['Intra','1–3d','4–10d','11–30d','31+d'];
  const getBucket=t=>{
    const d=Math.round((new Date(t.exit_date)-new Date(t.entry_date))/(1000*86400));
    if(d===0)return'Intra';if(d<=3)return'1–3d';if(d<=10)return'4–10d';if(d<=30)return'11–30d';return'31+d';
  };
  const data={};buckets.forEach(b=>data[b]=0);
  (trades||[]).forEach(t=>{const b=getBucket(t);data[b]+=t.pnl;});
  const vals=buckets.map(b=>data[b]);
  const maxAbs=Math.max(...vals.map(Math.abs),1);
  return (
    <div style={{height:'100%',padding:'8px 18px',display:'flex',flexDirection:'column'}}>
      <div style={{...S.hdr,marginBottom:6}}>Holding vs P&L</div>
      <div style={{flex:1,display:'flex',alignItems:'flex-end',gap:6}}>
        {buckets.map((b,i)=>{
          const v=vals[i], isPos=v>=0, ratio=Math.abs(v)/maxAbs;
          return (
            <div key={b} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',height:'100%',justifyContent:'flex-end'}}>
              <div style={{fontSize:8,fontFamily:'Space Mono',color:isPos?GREEN:RED,marginBottom:1}}>{v>=0?'+':''}{fmt(v,0)}</div>
              <div style={{width:'80%',background:isPos?`${GREEN}99`:`${RED}99`,height:`${ratio*70}%`,minHeight:2,borderRadius:'3px 3px 0 0'}}/>
              <div style={{fontSize:8,color:'#5a6478',fontFamily:'Space Grotesk',marginTop:3,textAlign:'center',whiteSpace:'nowrap'}}>{b}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Equity Curve ──────────────────────────────────────────────────────────────
function EquityCurve({data, trades=[], spyData=[]}) {
  const [range,    setRange]    = React.useState('ALL');
  const [hover,    setHover]    = React.useState(null);
  const [tradeTip, setTradeTip] = React.useState(null);
  const [showSpy,  setShowSpy]  = React.useState(false);
  const [dims,     setDims]     = React.useState({w:560, h:150});
  const wrapRef = React.useRef(null);

  React.useEffect(()=>{
    if (!wrapRef.current) return;
    const ro = new ResizeObserver(entries => {
      const {width, height} = entries[0].contentRect;
      if (width > 0 && height > 0) setDims({w: Math.floor(width), h: Math.floor(height)});
    });
    ro.observe(wrapRef.current);
    return () => ro.disconnect();
  }, []);

  if (!data || data.length === 0) return (
    <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'#5a6478',fontSize:12}}>No data</div>
  );

  const now = new Date();
  const cutDays = {'1M':30,'3M':90,'6M':180};
  const pts = range==='ALL' ? data : (()=>{
    const filtered = data.filter(d => (now - new Date(d.date))/86400000 <= cutDays[range]);
    return filtered.length > 1 ? filtered : data;
  })();

  const W = dims.w, H = dims.h;
  const PL=42, PR=showSpy?44:12, PT=10, PB=22;
  const cw = W-PL-PR, ch = H-PT-PB;
  const vals = pts.map(d=>d.pnl);
  const minV = Math.min(0,...vals), maxV = Math.max(0,...vals);
  const rng  = maxV - minV || 1;
  const px = i => PL + (i/(pts.length-1||1))*cw;
  const py = v => PT + (1-(v-minV)/rng)*ch;
  const zeroY = py(0);

  const linePts = pts.map((d,i)=>`${px(i)},${py(d.pnl)}`).join(' ');
  const areaPath = `M${px(0)},${py(pts[0].pnl)} `
    + pts.slice(1).map((d,i)=>`L${px(i+1)},${py(d.pnl)}`).join(' ')
    + ` L${px(pts.length-1)},${zeroY} L${px(0)},${zeroY} Z`;

  // ── Drawdown shading ──────────────────────────────────────────────────────
  const ddRects = [];
  let peak = -Infinity, ddStart = -1;
  pts.forEach((p,i) => {
    if (p.pnl > peak) {
      if (ddStart !== -1) ddRects.push({from:ddStart, to:i});
      peak = p.pnl; ddStart = -1;
    } else if (peak > 0 && p.pnl < peak) {
      if (ddStart === -1) ddStart = Math.max(0, i-1);
    }
  });
  if (ddStart !== -1) ddRects.push({from:ddStart, to:pts.length-1});

  // ── SPY line ──────────────────────────────────────────────────────────────
  let spyLinePts='', spyTicks=[], spyY=()=>0;
  const ptsFrom = pts.length ? pts[0].date : '';
  const ptsTo   = pts.length ? pts[pts.length-1].date : '';
  if (showSpy && spyData && spyData.length && pts.length > 1) {
    const spyF = spyData.filter(d => d.date >= ptsFrom && d.date <= ptsTo);
    if (spyF.length > 1) {
      const spyMin = Math.min(0,...spyF.map(d=>d.pct));
      const spyMax = Math.max(0,...spyF.map(d=>d.pct));
      const spyRng = spyMax - spyMin || 1;
      spyY = pct => PT + (1-(pct-spyMin)/spyRng)*ch;
      const t0 = new Date(pts[0].date).getTime();
      const t1 = new Date(pts[pts.length-1].date).getTime();
      spyLinePts = spyF.map(s=>{
        const fr = t1===t0 ? 0 : (new Date(s.date).getTime()-t0)/(t1-t0);
        return `${PL+fr*cw},${spyY(s.pct)}`;
      }).join(' ');
      spyTicks = [spyMin,(spyMin+spyMax)/2,spyMax].map(v=>({v,y:spyY(v)}));
    }
  }

  // ── R-multiple trade dots — one dot per date, grouped ────────────────────
  const EXCL = new Set(['SGOV','BOXX']);
  const byDate = {};
  (trades||[])
    .filter(t => !EXCL.has(t.symbol) && t.exit_date >= ptsFrom && t.exit_date <= ptsTo)
    .forEach(t => { (byDate[t.exit_date] = byDate[t.exit_date]||[]).push(t); });
  const tradeDots = Object.entries(byDate).map(([date, dayTrades]) => {
    let idx = pts.findIndex(p => p.date >= date);
    if (idx === -1) idx = pts.length - 1;
    const netPnl = dayTrades.reduce((s,t) => s + (t.r_multiple != null ? t.r_multiple : t.pnl), 0);
    return {cx:px(idx), cy:py(pts[idx].pnl), trades:dayTrades, color:netPnl>=0?GREEN:RED};
  });

  const yTicks = [minV, (minV+maxV)/2, maxV];
  const xIdxs  = pts.length > 2 ? [0, Math.floor((pts.length-1)/2), pts.length-1] : [0, pts.length-1];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtDate = s => { const [,m,d] = s.split('-'); return `${MONTHS[+m-1]} ${+d}`; };

  const onMouseMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    // check trade dots first (12px radius)
    const nearDot = tradeDots.find(d => Math.hypot(d.cx-mx, d.cy-my) < 12);
    if (nearDot) { setTradeTip(nearDot); setHover(null); return; }  // nearDot.trades is an array
    setTradeTip(null);
    const idx = pts.reduce((best,_,i) =>
      Math.abs(px(i)-mx) < Math.abs(px(best)-mx) ? i : best, 0);
    setHover({idx, hx:mx, hy:py(pts[idx].pnl)});
  };

  const ttLeft = hover ? Math.max(4, Math.min(hover.hx-52, W-120)) : 0;
  const ttTop  = hover ? Math.max(4, hover.hy-60) : 0;
  const dotTtLeft = tradeTip ? Math.max(4, Math.min(tradeTip.cx-60, W-160)) : 0;
  const dotTtTop  = tradeTip ? Math.max(4, tradeTip.cy-72) : 0;

  return (
    <div style={{height:'100%', display:'flex', flexDirection:'column'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6,flexShrink:0}}>
        <div style={S.hdr}>Equity Curve</div>
        <div style={{display:'flex',gap:2,alignItems:'center'}}>
          <button onClick={()=>setShowSpy(!showSpy)} style={{
            padding:'3px 9px',fontSize:9,borderRadius:4,
            border: showSpy ? `1px solid ${YELLOW}66` : '1px solid rgba(255,255,255,0.1)',
            background: showSpy ? `${YELLOW}18` : 'rgba(255,255,255,0.04)',
            color: showSpy ? YELLOW : '#8a96a8',
            fontFamily:'Space Mono',fontWeight:700,letterSpacing:'.04em',
          }} title="Compare vs SPY benchmark">vs SPY</button>
          {['1M','3M','6M','ALL'].map(r=>(
            <button key={r} onClick={()=>setRange(r)} style={{
              padding:'3px 8px',fontSize:9,borderRadius:4,border:'none',
              background: range===r ? `${ACCENT}22` : 'transparent',
              color: range===r ? ACCENT : '#5a6478',
              fontFamily:'Space Mono',fontWeight:700,letterSpacing:'.04em',
            }}>{r}</button>
          ))}
        </div>
      </div>

      <div ref={wrapRef} style={{flex:1, position:'relative', minHeight:0}}>
        <svg viewBox={`0 0 ${W} ${H}`}
          style={{width:'100%', height:'100%', display:'block', overflow:'visible'}}
          preserveAspectRatio="none"
          onMouseMove={onMouseMove}
          onMouseLeave={()=>{setHover(null);setTradeTip(null);}}>
          <defs>
            <linearGradient id="eqGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor="#4499ff" stopOpacity="0.25"/>
              <stop offset="100%" stopColor="#4499ff" stopOpacity="0"/>
            </linearGradient>
          </defs>

          {/* grid lines */}
          {yTicks.map((v,i) => (
            <line key={i} x1={PL} y1={py(v)} x2={W-PR} y2={py(v)} stroke="rgba(255,255,255,0.04)" strokeWidth="1"/>
          ))}

          {/* zero line */}
          <line x1={PL} y1={zeroY} x2={W-PR} y2={zeroY} stroke="rgba(255,255,255,0.15)" strokeWidth="1" strokeDasharray="4,3"/>

          {/* area + equity line */}
          <path d={areaPath} fill="url(#eqGrad)"/>
          <polyline points={linePts} fill="none" stroke="#4499ff" strokeWidth="2" strokeLinejoin="round"/>

          {/* SPY line */}
          {showSpy && spyLinePts && (
            <polyline points={spyLinePts} fill="none" stroke={YELLOW} strokeWidth="1.5" strokeDasharray="6,3" opacity="0.8"/>
          )}

          {/* R-multiple trade dots */}
          {tradeDots.map((d,i) => (
            <circle key={i} cx={d.cx} cy={d.cy} r="4"
              fill={d.color} stroke="#090c10" strokeWidth="1" opacity="0.85"
              style={{cursor:'pointer'}}/>
          ))}

          {/* resting last-point dot */}
          {!hover && !tradeTip && <circle cx={px(pts.length-1)} cy={py(pts[pts.length-1].pnl)} r="3" fill="#4499ff"/>}

          {/* left y-axis labels */}
          {yTicks.map((v,i) => (
            <text key={i} x={PL-5} y={py(v)+3} textAnchor="end" fontSize="9" fill="#5a6478" fontFamily="Space Mono">{fmt(v,0)}</text>
          ))}

          {/* right SPY axis labels */}
          {showSpy && spyTicks.map((t,i) => (
            <text key={i} x={W-PR+5} y={t.y+3} textAnchor="start" fontSize="9" fill={YELLOW} fontFamily="Space Mono" opacity="0.8">
              {t.v>=0?'+':''}{t.v.toFixed(1)}%
            </text>
          ))}

          {/* x-axis date labels */}
          {xIdxs.map((idx,i) => (
            <text key={i} x={px(idx)} y={H-3} textAnchor="middle" fontSize="9" fill="#5a6478" fontFamily="Space Mono">
              {pts[idx].date.slice(5)}
            </text>
          ))}

          {/* crosshair */}
          {hover && <>
            <line x1={hover.hx} y1={PT} x2={hover.hx} y2={H-PB} stroke="rgba(255,255,255,0.3)" strokeWidth="1"/>
            <circle cx={hover.hx} cy={hover.hy} r="4" fill="#4499ff" stroke="#090c10" strokeWidth="1.5"/>
          </>}
        </svg>

        {/* curve hover tooltip */}
        {hover && (
          <div style={{position:'absolute',left:ttLeft,top:ttTop,
            background:'#141a24',border:'1px solid rgba(255,255,255,0.1)',
            borderRadius:4,padding:'6px 10px',fontFamily:'Space Mono',fontSize:11,
            pointerEvents:'none',zIndex:20,whiteSpace:'nowrap'}}>
            <div style={{color:'#5a6478',marginBottom:3}}>{fmtDate(pts[hover.idx].date)}</div>
            <div style={{color:pts[hover.idx].pnl>=0?GREEN:RED,fontWeight:700}}>
              {pts[hover.idx].pnl>=0?'+':''}{fmt(pts[hover.idx].pnl,2)}
            </div>
          </div>
        )}

        {/* trade dot tooltip */}
        {tradeTip && (
          <div style={{position:'absolute',left:dotTtLeft,top:dotTtTop,
            background:'#141a24',border:`1px solid ${tradeTip.color}44`,
            borderRadius:4,padding:'6px 10px',fontFamily:'Space Mono',fontSize:11,
            pointerEvents:'none',zIndex:20,whiteSpace:'nowrap',minWidth:140}}>
            <div style={{color:'#5a6478',marginBottom:4,fontSize:9}}>{tradeTip.trades[0].exit_date}</div>
            {tradeTip.trades.map((t,i)=>{
              const c = (t.r_multiple!=null?t.r_multiple:t.pnl)>=0?GREEN:RED;
              return (
                <div key={i} style={{display:'flex',justifyContent:'space-between',gap:12,
                  marginBottom:i<tradeTip.trades.length-1?3:0,borderTop:i>0?'1px solid rgba(255,255,255,0.05)':'none',paddingTop:i>0?3:0}}>
                  <span style={{color:c,fontWeight:700}}>{t.symbol}</span>
                  <span style={{color:c}}>
                    {t.pnl>=0?'+':''}{fmt(t.pnl,2)}
                    {t.r_multiple!=null&&<span style={{opacity:.7,marginLeft:5}}>{fmt(t.r_multiple,2)}R</span>}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Sortable table header cell ────────────────────────────────────────────────
function SortTh({col, label, sort, onSort, align='left', style={}}) {
  const active = sort.col === col;
  return (
    <th onClick={()=>onSort(col)} style={{
      cursor:'pointer', userSelect:'none', textAlign:align,
      color: active ? ACCENT : '#5a6478', ...style,
    }}>
      {label}
      <span style={{marginLeft:4,fontSize:8,verticalAlign:'middle',
        color: active ? ACCENT : 'rgba(90,100,120,0.35)'}}>
        {active ? (sort.dir==='asc' ? '▲' : '▼') : '⇅'}
      </span>
    </th>
  );
}

// ── Resize handle ─────────────────────────────────────────────────────────────
function ResizeHandle({dir, active, onMouseDown}) {
  const [hover, setHover] = React.useState(false);
  const isV = dir === 'v';
  return (
    <div
      onMouseDown={onMouseDown}
      onMouseEnter={()=>setHover(true)}
      onMouseLeave={()=>setHover(false)}
      style={{
        flexShrink: 0,
        width:      isV ? '4px' : '100%',
        height:     isV ? '100%' : '4px',
        background: active ? '#4499ff' : hover ? 'rgba(68,153,255,0.3)' : 'rgba(255,255,255,0.06)',
        cursor:     isV ? 'col-resize' : 'row-resize',
        transition: 'background 0.15s',
        zIndex: 10,
      }}
    />
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({version, year}) {
  const [data,         setData]         = React.useState(null);
  const [metricsCache, setMetricsCache] = React.useState({});
  const [currency,     setCurrency]     = React.useState('ALL');
  const [loading,      setLoading]      = React.useState(true);
  const [loadErr,      setLoadErr]      = React.useState(null);
  const [spyData,      setSpyData]      = React.useState([]);
  const [posSort,      setPosSort]      = React.useState({col:null, dir:'asc'});

  // ── Panel resize state ──────────────────────────────────────────────────────
  const [kpiCollapsed, setKpiCollapsed] = React.useState(false);
  const [kpiW,     setKpiW]     = React.useState(180);  // px
  const [midFlex,  setMidFlex]  = React.useState(52);   // % of mid+right row
  const [eqFlex,   setEqFlex]   = React.useState(60);   // % of middle col height
  const [posFlex,  setPosFlex]  = React.useState(35);   // % of right-side height for positions
  const [setupFlex, setSetupFlex] = React.useState(50);
  const [activeRH,  setActiveRH]  = React.useState(null);
  const midRowRef  = React.useRef(null);
  const midColRef  = React.useRef(null);
  const rSideRef   = React.useRef(null);
  const rightColRef= React.useRef(null);

  function startDrag(e, which) {
    e.preventDefault();
    const axis = (which==='kpi'||which==='mid') ? 'x' : 'y';
    const start = axis==='x' ? e.clientX : e.clientY;
    const snap = {kpi:kpiW, mid:midFlex, eq:eqFlex, pos:posFlex, setup:setupFlex}[which];
    setActiveRH(which);
    const move = mv => {
      const d = (axis==='x' ? mv.clientX : mv.clientY) - start;
      if (which==='kpi') {
        setKpiW(Math.max(120, Math.min(300, snap+d)));
      } else if (which==='mid') {
        const W = midRowRef.current?.clientWidth||800;
        setMidFlex(Math.max(20, Math.min(80, snap+d/W*100)));
      } else if (which==='eq') {
        const H = midColRef.current?.clientHeight||400;
        setEqFlex(Math.max(20, Math.min(80, snap+d/H*100)));
      } else if (which==='setup') {
        const H = rightColRef.current?.clientHeight||400;
        setSetupFlex(Math.max(15, Math.min(80, snap+d/H*100)));
      } else {
        const H = rSideRef.current?.clientHeight||500;
        setPosFlex(Math.max(10, Math.min(60, snap-d/H*100)));
      }
    };
    const up = () => { setActiveRH(null); window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  }

  React.useEffect(()=>{
    (async () => {
      setLoading(true);
      setLoadErr(null);
      try {
        const yq = year ? `&year=${year}` : '';
        const [p, allM] = await Promise.all([api(`/portfolio?year=${year}`), api(`/metrics?currency=ALL${yq}`)]);
        setData(p);
        setMetricsCache({ALL: allM});
        setLoading(false);
        // Background: load individual currencies so switching is instant
        const others = (allM.currencies || []).filter(c => c !== 'ALL');
        others.forEach(ccy => {
          api(`/metrics?currency=${ccy}${yq}`)
            .then(m => setMetricsCache(prev => ({...prev, [ccy]: m})))
            .catch(()=>{});
        });
        if (allM.equity_curve?.length) {
          api(`/stats/spy?from_date=${allM.equity_curve[0].date}`).then(setSpyData).catch(()=>{});
        }
      } catch(e) {
        setLoadErr(e.message || 'Failed to connect to backend');
        setLoading(false);
      }
    })();
  }, [version]);

  const metrics = metricsCache[currency];
  if (loading) return <Spinner/>;
  if (loadErr) return (
    <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:12,color:'#5a6478',fontFamily:'Space Mono',fontSize:12}}>
      <div style={{color:RED,fontSize:13}}>Could not load data</div>
      <div style={{maxWidth:340,textAlign:'center',lineHeight:1.6,color:'#4a5568'}}>{loadErr}</div>
      <button style={{marginTop:8,padding:'6px 18px',background:ACCENT+'22',color:ACCENT,border:'none',borderRadius:4,fontFamily:'Space Mono',fontSize:11,cursor:'pointer'}}
        onClick={()=>window.location.reload()}>
        Retry
      </button>
    </div>
  );
  if (!data || !metrics) return <Spinner/>;

  // For ALL view, trades are USD-denominated; show 'USD' as the unit label
  const displayCcy = currency === 'ALL' ? 'USD' : currency;
  const currencies = metrics.currencies || ['USD'];
  const _p = v => v!=null ? (v>=0?'+':'')+fmt(v,2)+'%' : '—';
  const streak = metrics.current_streak || {count:0,type:null};
  const kpis = [
    {label:'Total P&L',            val:`${fmt(metrics.total_pnl,2)} ${displayCcy}`,                               color:pnlColor(metrics.total_pnl)},
    {label:'Avg. Profit%',         val:metrics.avg_win_pct!=null?'+'+fmt(metrics.avg_win_pct,2)+'%':'—',          color:GREEN},
    {label:'Avg. Loss%',           val:metrics.avg_loss_pct!=null?fmt(metrics.avg_loss_pct,2)+'%':'—',            color:RED},
    {label:'Expectancy R',         val:metrics.expectancy_r!=null?fmt(metrics.expectancy_r,2)+'R':'—',            color:metrics.expectancy_r!=null?(metrics.expectancy_r>0?GREEN:RED):'#c8d0e0'},
    {label:'R/R',                  val:metrics.rr_ratio!=null?fmt(metrics.rr_ratio,2)+' : 1':'—',                 color:metrics.rr_ratio!=null?(metrics.rr_ratio>=1?GREEN:RED):'#c8d0e0'},
    {label:'Win Rate',             val:pct(metrics.win_rate),                                                      color:metrics.win_rate>=0.4?GREEN:RED},
    {label:'Kelly Formula',        val:metrics.kelly!=null?fmt(metrics.kelly*100,1)+'%':'—',                      color:metrics.kelly!=null?(metrics.kelly>0?GREEN:RED):'#c8d0e0'},
    {label:'Profit Factor',        val:fmt(metrics.profit_factor,2),                                               color:metrics.profit_factor>=1?GREEN:RED},
    {label:'Max Drawdown',         val:metrics.max_drawdown?fmt(metrics.max_drawdown,2)+' '+displayCcy:'—',       color:RED},
    {label:'Avg Win Holding Days', val:metrics.avg_hold_winners?fmt(metrics.avg_hold_winners,1)+'d':'—',          color:'#c8d0e0'},
    {label:'Avg Loss Holding Days',val:metrics.avg_hold_losers?fmt(metrics.avg_hold_losers,1)+'d':'—',            color:'#c8d0e0'},
    {label:'Biggest % Profit',     val:metrics.biggest_win_pct!=null?'+'+fmt(metrics.biggest_win_pct,2)+'%':'—', color:GREEN},
    {label:'Biggest % Loser',      val:metrics.biggest_loss_pct!=null?fmt(metrics.biggest_loss_pct,2)+'%':'—',   color:RED},
    {label:'Current Streak',       val:streak.type?`${streak.count}${streak.type}`:'—',                           color:streak.type==='W'?GREEN:streak.type==='L'?RED:'#c8d0e0'},
    {label:'Best Win Streak',      val:metrics.longest_win_streak!=null?String(metrics.longest_win_streak):'—',   color:GREEN},
    {label:'Worst Loss Streak',    val:metrics.longest_loss_streak!=null?String(metrics.longest_loss_streak):'—', color:RED},
    {label:'Trades',               val:metrics.total_trades!=null?String(metrics.total_trades):'—',               color:'#c8d0e0'},
    {label:'Pending Review',       val:metrics.pending_review!=null?String(metrics.pending_review):'—',           color:metrics.pending_review>0?'#f5a623':'#c8d0e0'},
  ];

  const EXCL = new Set(['SGOV','BOXX']);
  const closedForCurrency = data ? (data.closed_trades||[]).filter(t=>
    (currency === 'ALL' || t.currency === currency) && !EXCL.has(t.symbol)
  ) : [];

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>

      {/* ── Main body: KPI col (full height) + right side ───────────────── */}
      <div className="dash-top" style={{flex:1,display:'flex',overflow:'hidden',minHeight:0}}>

        {/* KPI column — resizable width, collapsible */}
        <div className="dash-kpi" style={{width:kpiCollapsed?36:kpiW,display:'flex',flexDirection:'column',flexShrink:0,overflow:'hidden',transition:'width 0.18s ease'}}>
          {/* Toggle button */}
          <button onClick={()=>setKpiCollapsed(c=>!c)} style={{
            alignSelf:'flex-end',margin:'6px 6px 2px',padding:'2px 4px',
            background:'none',border:'none',cursor:'pointer',
            color:'#5a6478',fontSize:14,lineHeight:1,flexShrink:0,
          }} title={kpiCollapsed?'Expand':'Collapse'}>
            {kpiCollapsed ? '›' : '‹'}
          </button>
          {kpiCollapsed ? (
            /* Collapsed: vertical currency buttons */
            currencies.length > 1 && (
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,padding:'4px 0'}}>
                {currencies.map(c=>(
                  <button key={c} onClick={()=>{
                    setCurrency(c);
                    if (!metricsCache[c]) {
                      api(`/metrics?currency=${c}${yq}`)
                        .then(m => setMetricsCache(prev => ({...prev, [c]: m})))
                        .catch(()=>{});
                    }
                  }} style={{
                    width:28,padding:'5px 0',fontSize:8,borderRadius:4,border:'none',
                    background:currency===c?`${ACCENT}22`:'rgba(255,255,255,0.05)',
                    color:currency===c?ACCENT:'#5a6478',
                    fontFamily:'Space Mono',fontWeight:700,letterSpacing:'.04em',
                  }}>{c}</button>
                ))}
              </div>
            )
          ) : (
            /* Expanded: horizontal currency buttons + KPI list */
            <>
              {currencies.length > 1 && (
                <div style={{padding:'0 8px 4px',display:'flex',gap:6,flexShrink:0}}>
                  {currencies.map(c=>(
                    <button key={c} onClick={()=>{
                      setCurrency(c);
                      if (!metricsCache[c]) {
                        api(`/metrics?currency=${c}${yq}`)
                          .then(m => setMetricsCache(prev => ({...prev, [c]: m})))
                          .catch(()=>{});
                      }
                    }} style={{
                      flex:1,padding:'4px 0',fontSize:10,borderRadius:4,border:'none',
                      background:currency===c?`${ACCENT}22`:'rgba(255,255,255,0.05)',
                      color:currency===c?ACCENT:'#5a6478',
                      fontFamily:'Space Mono',fontWeight:700,letterSpacing:'.06em',
                    }}>{c}</button>
                  ))}
                </div>
              )}
              <div style={{overflowY:'auto',flex:1}}>
                {kpis.map((k,i)=>(
                  <div key={i} style={{padding:'9px 14px',borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
                    <div style={S.hdr}>{k.label}</div>
                    <div style={{...S.val,fontSize:15,color:k.color||'#c8d0e0'}}>{k.val}</div>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
        {!kpiCollapsed && <ResizeHandle dir='v' active={activeRH==='kpi'} onMouseDown={e=>startDrag(e,'kpi')}/>}

        {/* Right side: metric strip + charts + open positions */}
        <div ref={rSideRef} style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>

          {/* Metric strip */}
          <MetricStrip metrics={metrics} currency={displayCcy}/>

          {/* Middle + right panels */}
          <div ref={midRowRef} style={{flex:100-posFlex,display:'flex',overflow:'hidden',minHeight:0}}>

            {/* Middle: equity curve + holding chart */}
            <div ref={midColRef} className="dash-mid" style={{flex:midFlex,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
              <div className="dash-equity" style={{flex:eqFlex,overflow:'hidden',padding:'14px 18px',display:'flex',flexDirection:'column',minHeight:0}}>
                <EquityCurve data={metrics.equity_curve} trades={closedForCurrency} spyData={spyData}/>
              </div>
              <ResizeHandle dir='h' active={activeRH==='eq'} onMouseDown={e=>startDrag(e,'eq')}/>
              <div style={{flex:100-eqFlex,minHeight:0}}>
                <HoldingBarChart trades={closedForCurrency}/>
              </div>
            </div>
            <ResizeHandle dir='v' active={activeRH==='mid'} onMouseDown={e=>startDrag(e,'mid')}/>

            {/* Right: Edge stats + Setup + PanelC */}
            <div ref={rightColRef} style={{flex:100-midFlex,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:140}}>
              {(()=>{
                const cells = [
                  {label:'Expectancy',    val: metrics.expectancy_r!=null ? fmt(metrics.expectancy_r,2)+'R' : '—', color: metrics.expectancy_r>0?GREEN:metrics.expectancy_r<0?RED:'#c8d0e0'},
                  {label:'R / R',         val: metrics.rr_ratio!=null ? fmt(metrics.rr_ratio,2)+' : 1' : '—',       color: metrics.rr_ratio>=1?GREEN:metrics.rr_ratio!=null?RED:'#c8d0e0'},
                  {label:'Profit Factor', val: fmt(metrics.profit_factor,2),                                        color: metrics.profit_factor>=1?GREEN:RED},
                ];
                return (
                  <div style={{display:'flex',flexShrink:0,borderBottom:'1px solid rgba(255,255,255,0.06)',background:'rgba(255,255,255,0.015)'}}>
                    {cells.map((c,i)=>(
                      <div key={i} style={{flex:1,padding:'7px 10px',borderRight:i<cells.length-1?'1px solid rgba(255,255,255,0.06)':'none'}}>
                        <div style={S.hdr}>{c.label}</div>
                        <div style={{fontFamily:'Space Mono',fontWeight:700,fontSize:12,color:c.color}}>{c.val}</div>
                      </div>
                    ))}
                  </div>
                );
              })()}
              <div style={{flex:setupFlex,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
                <SetupPerformancePanel currency={currency}/>
              </div>
              <ResizeHandle dir='h' active={activeRH==='setup'} onMouseDown={e=>startDrag(e,'setup')}/>
              <div style={{flex:100-setupFlex,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}>
                <PanelC trades={closedForCurrency}/>
              </div>
            </div>
          </div>
          <ResizeHandle dir='h' active={activeRH==='pos'} onMouseDown={e=>startDrag(e,'pos')}/>

          {/* ── Open Positions ────── */}

            <div style={{...S.hdr,marginBottom:10}}>Open Positions ({data.open_positions.length})</div>
            {data.open_positions.length === 0
              ? <div style={{color:'#5a6478',fontSize:12}}>No open positions</div>
              : (() => {
                const tog = col => setPosSort(s=>({col, dir:s.col===col&&s.dir==='asc'?'desc':'asc'}));
                const rows = applySort(data.open_positions, posSort.col, posSort.dir);
                return (
                  <table>
                    <thead style={{position:'sticky',top:0,background:'#090c10',zIndex:10}}><tr>
                      <SortTh col="symbol"         label="Symbol"               sort={posSort} onSort={tog}/>
                      <SortTh col="currency"       label="Ccy"                  sort={posSort} onSort={tog}/>
                      <SortTh col="direction"      label="Dir"                  sort={posSort} onSort={tog}/>
                      <SortTh col="quantity"       label="Qty"                  sort={posSort} onSort={tog} align="right"/>
                      <SortTh col="avg_entry"      label="Avg Entry"            sort={posSort} onSort={tog} align="right"/>
                      <SortTh col="notional_usd"   label="Notional (% of acct)" sort={posSort} onSort={tog} align="right"/>
                      <SortTh col="stop_loss"      label="Stop"                 sort={posSort} onSort={tog} align="right"/>
                      <SortTh col="unrealized_pnl" label="P&L"                  sort={posSort} onSort={tog} align="right"/>
                      <SortTh col="pct_return"     label="% Ret"                sort={posSort} onSort={tog} align="right"/>
                    </tr></thead>
                    <tbody>
                      {rows.map((p,i)=><PositionRow key={i} p={p} idx={i} onRefresh={()=>api('/portfolio').then(setData)}/>)}
                    </tbody>
                  </table>
                );
              })()
            }
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Position row with expandable lots + inline stop-loss edit + trade review ───
function PositionRow({p, idx=0, onRefresh}) {
  const [open,       setOpen]       = React.useState(false);
  const [slVals,     setSlVals]     = React.useState({});
  const [saving,     setSaving]     = React.useState({});
  const [errs,       setErrs]       = React.useState({});
  const [review,     setReview]     = React.useState(null);
  const [form,       setForm]       = React.useState({});
  const [savingRev,  setSavingRev]  = React.useState(false);
  const [saveMsg,    setSaveMsg]    = React.useState('');

  const entryDate = p.entry_date || (p.lots?.[0]?.date ?? '');

  React.useEffect(()=>{
    if (!open || review !== null || !entryDate) return;
    api(`/trades/review?symbol=${encodeURIComponent(p.symbol)}&entry_date=${entryDate}`)
      .then(d=>{ setReview(d); setForm(d); })
      .catch(()=>{ setReview({}); setForm({}); });
  }, [open]);

  const saveSL = async (lotOrderId) => {
    setSaving(s=>({...s,[lotOrderId]:true})); setErrs(e=>({...e,[lotOrderId]:''}));
    try {
      const sl = parseFloat(slVals[lotOrderId]);
      await api(`/orders/${lotOrderId}/stop_loss`, {
        method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({stop_loss: sl > 0 ? sl : null}),
      });
      await onRefresh();
    } catch(e) { setErrs(er=>({...er,[lotOrderId]:e.message||String(e)})); }
    setSaving(s=>({...s,[lotOrderId]:false}));
  };

  const [deleting, setDeleting] = React.useState(false);
  const deletePosition = async () => {
    if (!confirm(`Delete all ${p.lots?.length||1} order(s) for ${p.symbol}? This cannot be undone.`)) return;
    setDeleting(true);
    try {
      await Promise.all((p.lots||[]).map(l => api(`/orders/${l.order_id}`, {method:'DELETE'})));
      await onRefresh();
    } catch(e) { alert('Delete failed: ' + e.message); }
    setDeleting(false);
  };

  const saveReview = async () => {
    setSavingRev(true); setSaveMsg('');
    try {
      await api('/trades/review', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({symbol:p.symbol, entry_date:entryDate, ...form})});
      setReview({...form}); setSaveMsg('Saved');
      setTimeout(()=>setSaveMsg(''), 2000);
      onRefresh();
    } catch(e) { setSaveMsg('Error: '+e.message); }
    setSavingRev(false);
  };

  const inputSt = {width:90,padding:'3px 6px',background:'#0a0d12',border:'1px solid rgba(255,255,255,0.12)',
    borderRadius:4,color:'#c8d0e0',fontSize:11,fontFamily:'Space Mono',outline:'none'};
  const selSt = {padding:'4px 6px',background:'#0a0d12',border:'1px solid rgba(255,255,255,0.12)',
    borderRadius:4,color:'#c8d0e0',fontSize:11,fontFamily:'Space Mono',width:'100%'};

  const sel = (key, opts) => (
    <select value={form[key]||''} onChange={e=>setForm(f=>({...f,[key]:e.target.value||null}))} style={selSt}>
      {opts.map(o=><option key={o} value={o}>{o||'— select —'}</option>)}
    </select>
  );

  return (
    <>
      <tr onClick={()=>setOpen(!open)} style={{cursor:'pointer',background:idx%2===1?'rgba(255,255,255,0.015)':'transparent'}}>
        <td style={{font:'700 13px/1 "Space Mono",monospace',color:(p.stop_loss&&p.setup_tag&&p.market_condition)?'#09CDDF':'#5a6478'}}>{p.symbol} <span style={{color:'#3a4258',fontSize:9}}>{open?'▲':'▼'}</span></td>
        <td style={{color:'#4a5670'}}>{p.currency}</td>
        <td>
          <span style={{display:'inline-flex',alignItems:'center',padding:'2px 6px',borderRadius:3,
            background:p.direction?.toUpperCase()==='LONG'?'#08888522':'#F96E8F22',
            color:p.direction?.toUpperCase()==='LONG'?'#088885':'#F96E8F',
            border:`1px solid ${p.direction?.toUpperCase()==='LONG'?'#08888544':'#F96E8F44'}`,
            fontSize:9,fontFamily:'Space Grotesk',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em'}}>
            {p.direction}
          </span>
        </td>
        <td style={{textAlign:'right'}}>{fmt(p.quantity)}</td>
        <td style={{textAlign:'right'}}>{fmt(p.avg_entry,4)}</td>
        <td style={{textAlign:'right',color:'#c8d0e0'}}>
          {fmt(p.notional,0)}
          {p.notional_pct!=null && <span style={{color:'#5a6478',fontSize:10,marginLeft:4}}>({fmt(p.notional_pct,1)}%)</span>}
        </td>
        <td style={{textAlign:'right',color:RED}}>{p.stop_loss ? fmt(p.stop_loss,4) : '—'}</td>
        <td style={{textAlign:'right',fontWeight:700,color:p.unrealized_pnl!=null?pnlColor(p.unrealized_pnl):'#5a6478'}}>
          {p.unrealized_pnl!=null ? (p.unrealized_pnl>=0?'+':'')+fmt(p.unrealized_pnl,2) : '—'}
        </td>
        <td style={{textAlign:'right',color:p.pct_return!=null?pnlColor(p.pct_return):'#5a6478'}}>
          {p.pct_return!=null ? (p.pct_return>=0?'+':'')+p.pct_return.toFixed(2)+'%' : '—'}
        </td>
      </tr>

      {open && <>
        {/* Lot rows with stop loss */}
        {(p.lots||[]).map(lot=>(
          <tr key={lot.order_id} style={{background:'rgba(255,255,255,0.02)'}}>
            <td style={{paddingLeft:20,color:'#5a6478',fontSize:10,fontFamily:'Space Mono'}}>{lot.date}</td>
            <td style={{color:'#5a6478',fontSize:10,textTransform:'uppercase'}}>{lot.action}</td>
            <td/>
            <td style={{textAlign:'right',color:'#5a6478',fontSize:11,fontFamily:'Space Mono'}}>{fmt(lot.quantity)}</td>
            <td style={{textAlign:'right',color:'#5a6478',fontSize:11,fontFamily:'Space Mono'}}>{fmt(lot.entry_price,4)}</td>
            <td style={{textAlign:'right'}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'flex-end',gap:4}}>
                <input type="number" step="any"
                  placeholder={lot.stop_loss ? fmt(lot.stop_loss,4) : 'set stop'}
                  value={slVals[lot.order_id] ?? (lot.stop_loss||'')}
                  onChange={e=>setSlVals(s=>({...s,[lot.order_id]:e.target.value}))}
                  style={inputSt}
                />
                <button onClick={e=>{e.stopPropagation();saveSL(lot.order_id);}}
                  disabled={saving[lot.order_id]}
                  style={{...S.btn(true),padding:'3px 8px',fontSize:10}}>
                  {saving[lot.order_id]?'…':'Save'}
                </button>
                {errs[lot.order_id] && <span style={{fontSize:10,color:RED}}>{errs[lot.order_id]}</span>}
              </div>
            </td>
            <td colSpan={2}/>
          </tr>
        ))}

        {/* Trade review form */}
        <tr style={{background:'rgba(255,255,255,0.01)'}}>
          <td colSpan={8} style={{padding:'12px 20px',borderTop:'1px solid rgba(255,255,255,0.04)'}}>
            <div style={{...S.hdr,marginBottom:10}}>Trade Review</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
              <div><div style={S.hdr}>Setup / Pattern</div>{sel('setup_tag', SETUP_TAGS)}</div>
              <div><div style={S.hdr}>Market Condition</div>{sel('market_condition', MARKET_CONDS)}</div>
              <div style={{gridColumn:'1/-1'}}>
                <div style={S.hdr}>Emotional Notes / Mistakes</div>
                <textarea rows={2} value={form.emotional_notes||''} style={{
                  resize:'vertical',width:'100%',padding:'6px 8px',background:'#0a0d12',
                  border:'1px solid rgba(255,255,255,0.12)',borderRadius:4,color:'#c8d0e0',
                  fontSize:11,fontFamily:'Space Mono',boxSizing:'border-box'}}
                  onChange={e=>setForm(f=>({...f,emotional_notes:e.target.value||null}))}
                  placeholder="What's your thesis? Any concerns or deviations from plan?"/>
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',justifyContent:'space-between'}}>
              <div style={{display:'flex',gap:8,alignItems:'center'}}>
                <button style={{...S.btn(true),padding:'4px 10px',fontSize:11}}
                  onClick={e=>{e.stopPropagation();saveReview();}} disabled={savingRev}>
                  {savingRev?'Saving…':'Save Review'}
                </button>
                {saveMsg && <span style={{fontSize:11,fontFamily:'Space Mono',color:saveMsg.startsWith('Error')?RED:GREEN}}>{saveMsg}</span>}
              </div>
              <button onClick={e=>{e.stopPropagation();deletePosition();}} disabled={deleting}
                style={{padding:'4px 10px',fontSize:11,fontFamily:'Space Mono',fontWeight:700,
                  background:'rgba(206,49,75,0.12)',border:'1px solid rgba(206,49,75,0.3)',
                  borderRadius:4,color:RED,cursor:'pointer'}}>
                {deleting ? 'Deleting…' : '✕ Delete Position'}
              </button>
            </div>
          </td>
        </tr>
      </>}
    </>
  );
}

// ── Closed Trade Row (expandable) ─────────────────────────────────────────────
function ClosedTradeRow({t, idx}) {
  const [open, setOpen] = React.useState(false);
  const isWin = t.pnl >= 0;
  const altBg = idx%2===1 ? 'rgba(255,255,255,0.015)' : 'transparent';
  const dirIsLong = t.direction?.toUpperCase()==='LONG';
  const dirColor = dirIsLong ? '#088885' : '#F96E8F';
  const hold = Math.round((new Date(t.exit_date)-new Date(t.entry_date))/(1000*86400));
  return (
    <>
      <tr onClick={()=>setOpen(!open)} style={{cursor:'pointer',background:altBg}}>
        <td style={{font:'700 13px/1 "Space Mono",monospace',color:'#09CDDF'}}>
          <span style={{marginRight:4,color:'#5a6478',fontSize:10}}>{open?'▼':'›'}</span>{t.symbol}
        </td>
        <td style={{color:'#4a5670'}}>{t.currency}</td>
        <td>
          <span style={{display:'inline-flex',alignItems:'center',padding:'2px 6px',borderRadius:3,
            background:dirIsLong?'#08888522':'#F96E8F22',color:dirColor,border:`1px solid ${dirColor}44`,
            fontSize:9,fontFamily:'Space Grotesk',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em'}}>
            {t.direction}
          </span>
        </td>
        <td>
          <span style={{display:'inline-flex',alignItems:'center',padding:'2px 6px',borderRadius:3,
            background:isWin?`${GREEN}22`:`${RED}22`,color:isWin?GREEN:RED,border:`1px solid ${isWin?GREEN:RED}44`,
            fontSize:9,fontFamily:'Space Grotesk',fontWeight:700,letterSpacing:'.06em'}}>
            {isWin?'WIN':'LOSS'}
          </span>
        </td>
        <td>{t.entry_date}</td>
        <td>{t.exit_date}</td>
        <td style={{textAlign:'right'}}>{fmt(t.quantity)}</td>
        <td style={{textAlign:'right',fontWeight:700,color:pnlColor(t.pnl)}}>{t.pnl>=0?'+':''}{fmt(t.pnl,2)}</td>
        <td style={{textAlign:'right',color:t.pct_return!=null?pnlColor(t.pct_return):'#5a6478'}}>
          {t.pct_return!=null?(t.pct_return>=0?'+':'')+t.pct_return.toFixed(2)+'%':'—'}
        </td>
        <td style={{textAlign:'right',color:t.r_multiple!=null?(t.r_multiple>=0?GREEN:RED):'#5a6478'}}>
          {t.r_multiple!=null?fmt(t.r_multiple,2)+'R':'—'}
        </td>
      </tr>
      {open && (
        <tr style={{background:altBg}}>
          <td colSpan={10} style={{padding:'10px 20px',borderTop:'1px solid rgba(255,255,255,0.04)'}}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:14}}>
              <div><div style={S.hdr}>Avg In</div><div style={{fontFamily:'Space Mono',fontSize:12,color:'#c8d0e0'}}>{fmt(t.avg_entry,4)}</div></div>
              <div><div style={S.hdr}>Avg Out</div><div style={{fontFamily:'Space Mono',fontSize:12,color:'#c8d0e0'}}>{fmt(t.avg_exit,4)}</div></div>
              <div><div style={S.hdr}>Fees</div><div style={{fontFamily:'Space Mono',fontSize:12,color:'#5a6478'}}>{fmt(t.fees,2)}</div></div>
              <div><div style={S.hdr}>Hold</div><div style={{fontFamily:'Space Mono',fontSize:12,color:'#5a6478'}}>{hold}d</div></div>
              <div><div style={S.hdr}>R Multiple</div><div style={{fontFamily:'Space Mono',fontSize:12,color:t.r_multiple!=null?(t.r_multiple>=0?GREEN:RED):'#5a6478'}}>{t.r_multiple!=null?fmt(t.r_multiple,2)+'R':'—'}</div></div>
            </div>
          </td>
        </tr>
      )}
    </>
  );
}

// ── Journal ───────────────────────────────────────────────────────────────────
function Journal({version, year}) {
  const [tab,        setTab]        = React.useState('Trade Log');
  const [data,       setData]       = React.useState(null);
  const [filter,     setFilter]     = React.useState('All');
  const [tradeSort,  setTradeSort]  = React.useState({col:'exit_date', dir:'desc'});

  React.useEffect(()=>{ api(`/portfolio?year=${year}`).then(setData); }, [version]);
  if (!data) return <Spinner/>;

  const closed  = data.closed_trades;
  const symbols = ['All',...new Set(closed.map(t=>t.symbol))].sort();
  const filtered = filter==='All' ? closed : closed.filter(t=>t.symbol===filter);

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{padding:'0 20px',flexShrink:0}}>
        <TabBar tabs={['Trade Log','Trade Replay']} active={tab} onChange={setTab}/>
      </div>
      <div style={{flex:1,overflow:'auto',padding:'16px 20px'}}>
        {tab==='Trade Log' && (()=>{
          const tog = col => setTradeSort(s=>({col, dir:s.col===col&&s.dir==='asc'?'desc':'asc'}));
          const rows = applySort(closed, tradeSort.col, tradeSort.dir);
          return (
            <>
              <div style={{...S.hdr,marginBottom:12}}>{closed.length} closed trades</div>
              <table>
                <thead><tr>
                  <SortTh col="symbol"     label="Symbol"  sort={tradeSort} onSort={tog}/>
                  <SortTh col="currency"   label="Ccy"     sort={tradeSort} onSort={tog}/>
                  <SortTh col="direction"  label="Dir"     sort={tradeSort} onSort={tog}/>
                  <th>Status</th>
                  <SortTh col="entry_date" label="Entry"   sort={tradeSort} onSort={tog}/>
                  <SortTh col="exit_date"  label="Exit"    sort={tradeSort} onSort={tog}/>
                  <SortTh col="quantity"   label="Qty"     sort={tradeSort} onSort={tog} align="right"/>
                  <SortTh col="pnl"        label="P&L"     sort={tradeSort} onSort={tog} align="right"/>
                  <SortTh col="pct_return" label="% Ret"   sort={tradeSort} onSort={tog} align="right"/>
                  <SortTh col="r_multiple" label="R"       sort={tradeSort} onSort={tog} align="right"/>
                </tr></thead>
                <tbody>
                  {rows.map((t,i)=><ClosedTradeRow key={i} t={t} idx={i}/>)}
                </tbody>
              </table>
            </>
          );
        })()}
        {tab==='Trade Replay' && (
          <>
            <div style={{marginBottom:12}}>
              <select style={{maxWidth:200}} value={filter} onChange={e=>setFilter(e.target.value)}>
                {symbols.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
            {filtered.map((t,i)=><TradeCard key={i} trade={t}/>)}
          </>
        )}
      </div>
    </div>
  );
}

const SETUP_TAGS      = ['','Breakout','Pullback','Reversal','Buyable Gapup','Other'];
const OUTCOME_REASONS = ['','Stop Hit','Target Hit','Manual Exit','Trail Stop'];
const MARKET_CONDS    = ['','Risk On','Neutral','Risk Off'];

function TradeCard({trade:t}) {
  const [open,          setOpen]          = React.useState(false);
  const [review,        setReview]        = React.useState(null);
  const [form,          setForm]          = React.useState({});
  const [loadingReview, setLoadingReview] = React.useState(false);
  const [fetchingMae,   setFetchingMae]   = React.useState(false);
  const [saving,        setSaving]        = React.useState(false);
  const [saveMsg,       setSaveMsg]       = React.useState('');

  const hold = Math.round((new Date(t.exit_date)-new Date(t.entry_date))/(1000*86400));

  const doFetchMaeMfe = async (currentForm) => {
    setFetchingMae(true);
    try {
      const p = new URLSearchParams({
        symbol:t.symbol, exchange:t.exchange||'', entry_date:t.entry_date,
        exit_date:t.exit_date, direction:t.direction, entry_price:t.avg_entry,
      });
      const d = await api(`/trades/maemfe?${p}`);
      if (d.mae!=null || d.mfe!=null) {
        const merged = {...currentForm, ...d};
        setForm(merged);
        setReview(r=>({...r,...d}));
        await api('/trades/review',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({symbol:t.symbol,entry_date:t.entry_date,...merged})});
      }
    } catch(e){}
    setFetchingMae(false);
  };

  React.useEffect(()=>{
    if (!open || review!==null) return;
    setLoadingReview(true);
    api(`/trades/review?symbol=${encodeURIComponent(t.symbol)}&entry_date=${t.entry_date}`)
      .then(d=>{ setReview(d); setForm(d);
        if (d.mae==null && d.mfe==null) doFetchMaeMfe(d);
      })
      .catch(()=>{ setReview({}); setForm({}); doFetchMaeMfe({}); })
      .finally(()=>setLoadingReview(false));
  }, [open]);

  const save = async () => {
    setSaving(true); setSaveMsg('');
    try {
      await api('/trades/review',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({symbol:t.symbol,entry_date:t.entry_date,...form})});
      setReview({...form}); setSaveMsg('Saved');
      setTimeout(()=>setSaveMsg(''),2000);
    } catch(e){ setSaveMsg('Error: '+e.message); }
    setSaving(false);
  };

  const sel = (key,opts) => (
    <select value={form[key]||''} onChange={e=>setForm(f=>({...f,[key]:e.target.value||null}))}
      style={{width:'100%',padding:'4px 6px',background:'#0a0d12',border:'1px solid rgba(255,255,255,0.12)',
        borderRadius:4,color:'#c8d0e0',fontSize:11,fontFamily:'Space Mono'}}>
      {opts.map(o=><option key={o} value={o}>{o||'— select —'}</option>)}
    </select>
  );

  const statCell = (lbl,val,color) => (
    <div key={lbl}>
      <div style={S.hdr}>{lbl}</div>
      <div style={{fontFamily:'Space Mono',fontSize:12,color:color||'#c8d0e0'}}>{val}</div>
    </div>
  );

  return (
    <div style={{marginBottom:6,border:'1px solid rgba(255,255,255,0.06)',borderRadius:6,overflow:'hidden'}}>
      <button onClick={()=>setOpen(!open)} style={{
        width:'100%',display:'flex',justifyContent:'space-between',alignItems:'center',
        padding:'10px 14px',background:'#0f1318',border:'none',color:'#c8d0e0',textAlign:'left',
      }}>
        <span style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontFamily:'Space Mono',fontSize:10,color:'#5a6478'}}>{t.exit_date}</span>
          <span style={{fontSize:10,color:'#5a6478',fontFamily:'Space Grotesk',textTransform:'uppercase',letterSpacing:'.06em'}}>{t.direction}</span>
          <span style={S.ticker}>{t.symbol}</span>

// ── Position Sizer ────────────────────────────────────────────────────────────
function PositionSizer() {
  const [acct,    setAcct]    = React.useState('');
  const [riskPct, setRiskPct] = React.useState('1');
  const [entry,   setEntry]   = React.useState('');
  const [stop,    setStop]    = React.useState('');

  const accountSize  = parseFloat(acct)    || 0;
  const riskPctVal   = parseFloat(riskPct) || 0;
  const entryPrice   = parseFloat(entry)   || 0;
  const stopPrice    = parseFloat(stop)    || 0;

  const riskPerShare = entryPrice > 0 && stopPrice > 0 ? Math.abs(entryPrice - stopPrice) : 0;
  const dollarRisk   = accountSize * riskPctVal / 100;
  const shares       = riskPerShare > 0 ? Math.floor(dollarRisk / riskPerShare) : 0;
  const posSize      = shares * entryPrice;
  const posPct       = accountSize > 0 ? (posSize / accountSize * 100) : 0;
  const impliedR     = entryPrice > 0 && stopPrice > 0 ? Math.abs(entryPrice - stopPrice) : 0;

  const inp = (label, val, set, placeholder) => (
    <div style={{marginBottom:12}}>
      <div style={S.hdr}>{label}</div>
      <input type="number" step="any" value={val} placeholder={placeholder}
        onChange={e=>set(e.target.value)} style={{maxWidth:200}}/>
    </div>
  );
  const result = (label, val, color) => (
    <div style={{padding:'10px 14px',borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
      <div style={S.hdr}>{label}</div>
      <div style={{...S.val,fontSize:16,color:color||'#c8d0e0'}}>{val}</div>
    </div>
  );

  return (
    <div style={{maxWidth:480}}>
      <div style={{...S.hdr,fontSize:11,marginBottom:16}}>Position Size Calculator</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:0,marginBottom:20,
        background:'#0f1318',border:'1px solid rgba(255,255,255,0.06)',borderRadius:8,overflow:'hidden'}}>
        <div style={{padding:'14px',borderRight:'1px solid rgba(255,255,255,0.06)'}}>
          {inp('Account Size', acct, setAcct, '100000')}
          {inp('Risk per Trade (%)', riskPct, setRiskPct, '1')}
          {inp('Entry Price', entry, setEntry, '150.00')}
          {inp('Stop Loss Price', stop, setStop, '145.00')}
        </div>
        <div>
          {result('Shares to Buy', shares > 0 ? fmt(shares,0) : '—', shares>0?'#c8d0e0':'#5a6478')}
          {result('Dollar at Risk', dollarRisk > 0 ? '$'+fmt(dollarRisk,2) : '—', RED)}
          {result('Position Size', posSize > 0 ? '$'+fmt(posSize,2) : '—')}
          {result('% of Account', posPct > 0 ? posPct.toFixed(1)+'%' : '—',
            posPct > 20 ? RED : posPct > 10 ? YELLOW : posPct > 0 ? GREEN : '#5a6478')}
          {result('Risk per Share', riskPerShare > 0 ? '$'+riskPerShare.toFixed(4) : '—')}
        </div>
      </div>
      <div style={{fontSize:11,color:'#5a6478',fontFamily:'Space Mono',lineHeight:1.7}}>
        Shares = (Account × Risk%) ÷ |Entry − Stop|<br/>
        {posPct > 20 && <span style={{color:RED}}>⚠ Position &gt;20% of account — consider reducing size</span>}
      </div>
    </div>
  );
}

function HoldingTable({rows}) {
  const ORDER = ['Intraday','1–3 days','4–10 days','11–30 days','31+ days'];
  const entries = ORDER.filter(k => rows[k]).map(k => [k, rows[k]]);
  if (!entries.length) return null;
  return (
    <div style={{gridColumn:'1 / -1'}}>
      <div style={{...S.hdr,marginBottom:10}}>Holding Period</div>
      <table>
        <thead><tr>
          <th>Period</th>
          <th style={{textAlign:'right'}}>Count</th>
          <th style={{textAlign:'right'}}>Win Rate</th>
          <th style={{textAlign:'right'}}>Avg Days</th>
          <th style={{textAlign:'right'}}>Total P&L</th>
        </tr></thead>
        <tbody>
          {entries.map(([label, v])=>(
            <tr key={label}>
              <td style={{...S.ticker,fontSize:12}}>{label}</td>
              <td style={{textAlign:'right'}}>{v.count}</td>
              <td style={{textAlign:'right'}}>{pct(v.win_rate)}</td>
              <td style={{textAlign:'right'}}>{v.avg_days}d</td>
              <td style={{textAlign:'right',fontWeight:700,color:pnlColor(v.total_pnl)}}>{v.total_pnl>=0?'+':''}{fmt(v.total_pnl,0)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

                  <div style={{color:'#5a6478',fontFamily:'Space Mono',fontSize:11}}>
                    Already processed: {syncResult.skipped_already_processed}<br/>
                    No order found: {syncResult.skipped_no_order}<br/>
                    Errors: {syncResult.errors?.length||0}
                  </div>
                </div>
              )}
              {syncResult?.error && <div style={{marginTop:12,color:RED,fontSize:12}}>{syncResult.error}</div>}
            </div>
            <div>
              <div style={{...S.hdr,fontSize:11,marginBottom:14,paddingBottom:8,borderBottom:'1px solid rgba(255,255,255,0.06)'}}>Upload CSV / XLSX</div>
              <div style={{marginBottom:12}}>
                <div style={S.hdr}>Broker</div>
                <select value={broker} onChange={e=>setBroker(e.target.value)}>
                  <option>IBKR</option><option>CHIEF</option>
                </select>
              </div>
              <label style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',
                background:'rgba(255,255,255,0.04)',border:'1px dashed rgba(255,255,255,0.08)',
                borderRadius:6,cursor:'pointer',fontSize:12,color:'#5a6478'}}>
                ↑ Choose CSV or XLSX file
                <input type="file" accept=".csv,.xlsx" style={{display:'none'}} onChange={async e=>{
                  const f = e.target.files[0]; if (!f) return;
                  const fd = new FormData(); fd.append('file',f); fd.append('broker',broker);
                  const r = await fetch(API+'/import/file',{method:'POST',body:fd});
                  const d = await r.json();
                  alert(`Queued: ${d.queued}, Duplicates: ${d.duplicates}${d.errors.length?' Errors: '+d.errors.join(', '):''}`)
                  onDataChange();
                }}/>
              </label>
            </div>
          </div>
        )}

        {tab==='Diagnostics' && (
          <div style={{maxWidth:560}}><DiagnosticsPanel/></div>
        )}

        {tab==='Review Queue' && (
          <ReviewQueue pending={pending} onRefresh={async()=>{ await loadPending(); onDataChange(); }}/>
        )}
      </div>
    </div>
  );
}

function ReviewQueue({pending, onRefresh}) {
  const [approving, setApproving] = React.useState(false);
  const [batchErr, setBatchErr] = React.useState('');

  const approveAll = async () => {
    setApproving(true); setBatchErr('');
    try {
      await Promise.all(pending.map(r=>api(`/review/${r.id}/approve`,{method:'POST'})));
      await onRefresh();
    } catch(e) { setBatchErr(e.message || String(e)); }
    setApproving(false);
  };
  const rejectAll = async () => {
    setBatchErr('');
    try {
      await Promise.all(pending.map(r=>api(`/review/${r.id}/reject`,{method:'POST'})));
      await onRefresh();
    } catch(e) { setBatchErr(e.message || String(e)); }
  };

  if (pending.length===0) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:200}}>
      <div style={{textAlign:'center',padding:'32px 40px',background:`${GREEN}0a`,border:`1px solid ${GREEN}22`,borderRadius:10}}>
        <div style={{fontSize:22,marginBottom:10,color:GREEN}}>✓</div>
        <div style={{fontSize:13,color:GREEN,fontWeight:600}}>No pending items — all clear</div>
      </div>
    </div>
  );

  return (
    <>
      <div style={{display:'flex',gap:10,alignItems:'center',marginBottom:16,flexWrap:'wrap'}}>
        <span style={{fontSize:12,color:'#5a6478'}}>{pending.length} order(s) awaiting review</span>
        <button style={S.btn(true)} onClick={approveAll} disabled={approving}>{approving?'Approving…':'Approve All'}</button>
        <button style={S.btn()} onClick={rejectAll}>Reject All</button>
        {batchErr && <span style={{fontSize:11,color:RED,fontFamily:'Space Mono'}}>{batchErr}</span>}
      </div>
      {pending.map(r=><ReviewItem key={r.id} item={r} onRefresh={onRefresh}/>)}
    </>
  );
}

function ReviewItem({item, onRefresh}) {
  const [open,         setOpen]         = React.useState(false);
  const [busy,         setBusy]         = React.useState(false);
  const [err,          setErr]          = React.useState('');
  const [stopLoss,     setStopLoss]     = React.useState(item.normalized?.stop_loss_at_entry || '');
  const [closedTrades, setClosedTrades] = React.useState(null);

  const act = async (action) => {
    setBusy(true); setErr('');
    try {
      const opts = {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'};
      if (action === 'approve') {
        const sl = parseFloat(stopLoss);
        opts.body = JSON.stringify({stop_loss: sl > 0 ? sl : null});
      }
      const res = await api(`/review/${item.id}/${action}`, opts);
      if (action === 'approve' && ['SELL','COVER'].includes(item.action)) {
        // Always show outcome modal for sell orders, with API data or a fallback
        const trades = res.closed_trades?.length ? res.closed_trades : [{
          symbol: item.symbol,
          direction: item.action === 'SELL' ? 'LONG' : 'SHORT',
          entry_date: null,
          exit_date: item.normalized?.order_date || null,
          pnl: null,
          currency: item.normalized?.currency || '',
        }];
        setClosedTrades(trades);
        setBusy(false);
      } else {
        await onRefresh();
      }
    } catch(e) {
      setErr(e.message || String(e));
      setBusy(false);
    }
  };

  return (
    <>
    <div style={{marginBottom:6,border:'1px solid rgba(255,255,255,0.06)',borderRadius:6,overflow:'hidden'}}>
      <button onClick={()=>setOpen(!open)} style={{
        width:'100%',display:'flex',justifyContent:'space-between',alignItems:'center',
        padding:'10px 14px',background:'#0f1318',border:'none',color:'#c8d0e0',textAlign:'left',
      }}>
        <span style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:10,fontFamily:'Space Mono',fontWeight:700,color:['BUY','SHORT'].includes(item.action)?GREEN:RED,textTransform:'uppercase',letterSpacing:'.06em'}}>{item.action}</span>
          <span style={S.ticker}>{item.symbol}</span>
          <span style={{color:'#5a6478',fontFamily:'Space Mono'}}>×{item.quantity}</span>
          <span style={{color:'#5a6478',fontSize:10,letterSpacing:'.06em'}}>{item.broker}</span>
        </span>
        <span style={{color:item.confidence>=0.9?GREEN:YELLOW,fontSize:11,fontFamily:'Space Mono'}}>
          {Math.round(item.confidence*100)}%
        </span>
      </button>
      {open && (
        <div style={{padding:'14px',background:'#0f1318',borderTop:'1px solid rgba(255,255,255,0.06)'}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
            <div>
              <div style={S.hdr}>Normalized</div>
              <pre style={{fontSize:10,color:'#5a6478',whiteSpace:'pre-wrap',wordBreak:'break-all'}}>{JSON.stringify(item.normalized,null,2)}</pre>
            </div>
            <div>
              <div style={S.hdr}>Raw parsed</div>
              <pre style={{fontSize:10,color:'#5a6478',whiteSpace:'pre-wrap',wordBreak:'break-all'}}>{JSON.stringify(item.raw,null,2)}</pre>
            </div>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
            <span style={{fontSize:11,color:'#5a6478',fontFamily:'Space Grotesk'}}>Stop Loss</span>
            <input
              type="number" step="any" placeholder="e.g. 148.50"
              value={stopLoss}
              onChange={e=>setStopLoss(e.target.value)}
              style={{width:110,padding:'4px 8px',background:'#0a0d12',border:'1px solid rgba(255,255,255,0.12)',
                borderRadius:4,color:'#c8d0e0',fontSize:12,fontFamily:'Space Mono',outline:'none'}}
            />
            {stopLoss && <span style={{fontSize:11,color:'#5a6478',fontFamily:'Space Mono'}}>
              Risk/share: {item.normalized?.price ? Math.abs(item.normalized.price - parseFloat(stopLoss)).toFixed(4) : '—'}
            </span>}
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <button style={S.btn(true)} onClick={()=>act('approve')} disabled={busy}>{busy?'Working…':'Approve'}</button>
            <button style={S.btn()} onClick={()=>act('reject')} disabled={busy}>Reject</button>
            {err && <span style={{fontSize:11,color:RED,fontFamily:'Space Mono'}}>{err}</span>}
          </div>
        </div>
      )}
    </div>
    {closedTrades && (
      <OutcomeModal
        trades={closedTrades}
        onClose={async () => { setClosedTrades(null); await onRefresh(); }}
      />
    )}
    </>
  );
}

function Spinner() {
